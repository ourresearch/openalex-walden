resources:
  jobs:
    TaxiCab_Campaign:
      name: TaxiCab Campaign
      # oxjob #1790: the campaign guard. A stateless 20-min tick that runs every re-scrape campaign in
      # openalex.taxicab.campaigns (status 'active') in waves through TaxiCab Rescrape, with a pilot per
      # host, a stop rule, its own Zyte API key and a billing-cycle dollar cap. How to start, pause and
      # resume a campaign: the notebook's first cell. Keep the schedule UNPAUSED only while a campaign
      # runs (a tick with nothing to do exits at once, but still starts serverless compute).
      email_notifications:
        on_failure:
          - jason@ourresearch.org
        no_alert_for_skipped_runs: true
      schedule:
        quartz_cron_expression: 0 10/20 * * * ?
        timezone_id: UTC
        pause_status: PAUSED
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: tick
          environment_key: Default
          notebook_task:
            notebook_path: notebooks/scraping/taxicab_campaign
            source: GIT
            base_parameters:
              campaign: ""
          timeout_seconds: 1800
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      parameters:
        - name: campaign
          default: ""
