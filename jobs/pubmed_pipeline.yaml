# PubMed DLT pipeline (d327518b-e3e0-484c-a214-c7326f3e51fe).
# Bundle-managed: notebook code deploys via CI on push to main — do NOT pull the
# /Shared/openalex-walden Git folder for this pipeline; edits made in the pipeline UI
# (settings AND code) are reverted on the next deploy.
resources:
  pipelines:
    pubmed_pipeline:
      name: PubMed
      catalog: openalex
      target: pubmed
      serverless: false
      photon: false
      clusters:
        - label: default
          node_type_id: r5d.8xlarge
          driver_node_type_id: r5d.8xlarge
          num_workers: 20
      continuous: false
      development: true
      channel: CURRENT
      configuration:
        environment: prod
        pipelines.clusterShutdown.delay: 300s
      tags:
        environment: prod
        workflow: pubmed
      libraries:
        - notebook:
            path: ../notebooks/ingest/PubMed.py
