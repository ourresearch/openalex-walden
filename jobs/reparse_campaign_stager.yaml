resources:
  jobs:
    Reparse_Campaign_Stager:
      name: Reparse Campaign Stager
      # oxjob #984: stateless 20-min tick that chains a re-parse campaign (stage →
      # launch Parse PDFs in reparse mode → next tick). PAUSED 2026-09-08: the
      # legacy-backfill population is exhausted. To run another campaign, point
      # REMAINDER_SELECT at the new population and unpause.
      email_notifications:
        on_failure:
          - casey@ourresearch.org
        no_alert_for_skipped_runs: true
      schedule:
        quartz_cron_expression: 0 5/20 * * * ?
        timezone_id: UTC
        pause_status: PAUSED
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: stage
          environment_key: Default
          notebook_task:
            notebook_path: notebooks/parsing/reparse_campaign_stager
            source: GIT
          timeout_seconds: 1800
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
