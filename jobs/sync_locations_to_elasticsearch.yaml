resources:
  jobs:
    Sync_Locations_to_Elasticsearch:
      name: Sync Locations to Elasticsearch
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      tasks:
        - task_key: sync_locations
          job_cluster_key: sync_locations_cluster
          notebook_task:
            notebook_path: notebooks/elastic/sync_locations
            source: GIT
            base_parameters:
              is_full_sync: "true"
      job_clusters:
        - job_cluster_key: sync_locations_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            aws_attributes:
              first_on_demand: 1
              availability: ON_DEMAND
              zone_id: auto
            node_type_id: rd-fleet.12xlarge
            driver_node_type_id: rd-fleet.8xlarge
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 1
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
