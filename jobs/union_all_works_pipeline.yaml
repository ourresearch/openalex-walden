# Union All Works DLT pipeline (bd9dfc4f-7b7f-42a2-b01b-8101c5ab19d5).
# Bundle-managed: notebook code deploys via CI on push to main — do NOT pull the
# /Shared/openalex-walden Git folder for this pipeline; edits made in the pipeline UI
# are reverted on the next deploy.
#
# FULL REFRESH procedure (locations_parsed is truncated for hours during rebuild):
#   1. Pause "Walden End 2 End" and the standalone "Union All Works" job first.
#   2. Switch the pipeline to classic compute for the refresh:
#        serverless: false
#        photon: false
#        clusters:
#          - label: default
#            node_type_id: r5d.8xlarge
#            driver_node_type_id: r5d.8xlarge
#            autoscale:
#              min_workers: 5
#              max_workers: 10
#              mode: LEGACY          # legacy autoscaling, not ENHANCED
#      (commit the swap, let CI deploy it, run the full refresh, then revert the
#      commit so the next deploy restores serverless.)
#   3. Verify the rebuilt row count before unpausing the jobs.
# Reminder: changing an apply_changes key REQUIRES a full refresh.
resources:
  pipelines:
    union_all_works_pipeline:
      name: Union All Works
      catalog: openalex
      schema: works
      # TEMPORARY (#807 union full refresh — propagate cleaned titles/abstracts and
      # reset the CDF checkpoint past the pubmed_works backing-table migration):
      # classic per the runbook above, plus ON_DEMAND workers (r5d.8xlarge spot was
      # reclaimed repeatedly during #789's 08-17 run). REVERT to serverless+photon
      # after the refresh completes.
      serverless: false
      photon: false
      clusters:
        - label: default
          node_type_id: r5d.8xlarge
          driver_node_type_id: r5d.8xlarge
          aws_attributes:
            availability: ON_DEMAND
            zone_id: auto
          autoscale:
            min_workers: 5
            max_workers: 10
            mode: LEGACY
      continuous: false
      development: false
      edition: ADVANCED
      channel: CURRENT
      configuration:
        environment: prod
        pipelines.clusterShutdown.delay: 300s
        spark.sql.execution.arrow.maxRecordsPerBatch: "3000"
      tags:
        environment: prod
      libraries:
        - notebook:
            path: ../notebooks/ingest/UnionAllWorksIntoLocationsParsed.ipynb
