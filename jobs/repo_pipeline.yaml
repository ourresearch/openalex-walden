# Repo DLT pipeline (fcd1ea61-2e07-433b-90ad-b3b0a0960158).
# Bundle-managed: notebook code deploys via CI on push to main — do NOT pull the
# /Shared/openalex-walden Git folder for this pipeline; edits made in the pipeline UI
# (settings AND code) are reverted on the next deploy.
#
# FULL REFRESH cautions:
#   - repo full refreshes are S3-listing-bound and can take DAYS (oxjob #546 small-files).
#   - ingested_at is the S3 object mtime as of oxjob #911 (arrival time, stable across
#     re-reads), so a full refresh no longer restamps the corpus to now() — it backfills
#     pre-#911 rows to their true mtimes, which sit OUTSIDE TaxiCab's lookback window.
#     The #542 ingested_after guard is therefore legacy; keep it until the first
#     post-#911 full refresh verifies no flood.
resources:
  pipelines:
    repo_pipeline:
      name: Repo
      catalog: openalex
      target: repo
      # FULL-REFRESH PROFILE -- swap `serverless: true` for the block below AND set
      # maxRecordsPerBatch to "2000", deploy, run the refresh, then revert both and deploy
      # again. photon stays OFF: it crashed repo_enriched's Pandas-UDF stage on 08-28
      # ("Python worker exited unexpectedly") because its off-heap reservation squeezes the
      # Python sandbox, and a refresh runs those stages. (An older version of this comment
      # said `photon: true`, contradicting the #911 note below it -- corrected on #945.)
      #
      #   serverless: false
      #   photon: false
      #   clusters:
      #     - label: default
      #       node_type_id: r5d.8xlarge
      #       driver_node_type_id: r5d.8xlarge
      #       num_workers: 20
      #
      # oxjob #945 (2026-09-01), measured on this profile: repo_parsed read 1,148,681,383
      # repo_items rows and emitted 219,866,634 in ~14 min; repo_enriched then processed
      # 536,529,095 rows (219.9M from repo_parsed, ~316.6M from the backfill/IRDB CDF
      # passthroughs) in 3h29m. The cluster+batch-size levers are therefore SPENT --
      # repo_enriched is UDF-bound, and the remaining headroom is text_clean's
      # _fallback_signature regex (86%+ of abstract-path tottime, still unshipped).
      #
      # On maxRecordsPerBatch: the serverless-era values (500, now 125) were never chosen for
      # Repo deliberately -- inherited from the pre-bundle live pipeline (see 1fd4c45e on the
      # sibling DataCite Awards pipeline: "likely set during initial tuning to limit memory
      # under PyArrow conversion (default is 10000)"). r5d.8xlarge has 256 GiB a node, so a
      # small batch throttles every Pandas UDF in repo_enriched -- author last-name parsing,
      # abstract cleaning + inverted index, title cleaning, best_type_udf.
      # UNTESTED: step it up (2000 -> 4000), do not jump straight to the 10000 default. The
      # known OOM in this path was the whole-authors-array JSON round-trip on hyperauthorship
      # works; that specific bug is fixed, but it is the reason to be incremental. Note #945
      # ran at 2000 and repo_enriched still took 3h29m, so expect little from 4000.
      # oxjob #911 refresh notes (2026-08-28, for the next refresh window):
      #   - repo_items re-ingest ran ~6h at 60x r5d.8xlarge photon-off; the binding
      #     constraint was cloudFiles.maxFilesPerTrigger (fixed in Repo.py at 50000),
      #     not cores or photon. 20 workers suffice for Delta-side stages.
      #   - photon ON crashed repo_enriched's Pandas-UDF stage ("Python worker exited
      #     unexpectedly") -- its off-heap reservation squeezes the Python sandbox.
      #     Keep photon OFF whenever the UDF stages run.
      serverless: false
      photon: false
      clusters:
        - label: default
          node_type_id: r5d.8xlarge
          driver_node_type_id: r5d.8xlarge
          num_workers: 20
      continuous: false
      development: false
      edition: ADVANCED
      channel: CURRENT
      configuration:
        environment: prod
        pipelines.clusterShutdown.delay: 300s
        spark.sql.legacy.timeParserPolicy: CORRECTED
        # oxjob #911 (2026-08-28): 500 -> 125 for serverless. The harvester's return
        # brought hyperauthorship-scale rows (max 5,718 authors, 1.37MB metadata in one
        # record) that overflow the serverless Python sandbox mid-batch -- repo_enriched
        # died twice at ~12min ("Python worker exited unexpectedly"). The same rows fit
        # on classic r5d.8xlarge photon-off. 125 quarters the per-batch spike; raise to
        # 2000 with the classic full-refresh profile above (proven 08-26/08-28).
        # oxjob #945: raised to "2000" for the 09-01 classic-profile refresh, reverted here.
        spark.sql.execution.arrow.maxRecordsPerBatch: "2000"
      tags:
        environment: prod
        workflow: repo
      libraries:
        - notebook:
            path: ../notebooks/ingest/Repo.py
