# Repo DLT pipeline (fcd1ea61-2e07-433b-90ad-b3b0a0960158).
# Bundle-managed: notebook code deploys via CI on push to main — do NOT pull the
# /Shared/openalex-walden Git folder for this pipeline; edits made in the pipeline UI
# (settings AND code) are reverted on the next deploy.
#
# FULL REFRESH cautions:
#   - repo full refreshes are S3-listing-bound and can take DAYS (oxjob #546 small-files).
#   - a full refresh of repo_items re-stamps ingested_at; TaxiCab Repos reads it as a
#     watermark — set its ingested_after cutoff first (oxjob #542).
resources:
  pipelines:
    repo_pipeline:
      name: Repo
      catalog: openalex
      target: repo
      # TEMPORARY (oxjob 733 E2a): classic compute for the repo_enriched+repo_works
      # selective full refresh (provenance restamp db010d90 + _sequence hash 15a57337).
      # Photon + fixed 20 workers for the refresh window only (2x DBU rate — too
      # costly for the 3x-daily incremental runs).
      # REVERT after the refresh completes and provenance/row counts verify:
      # photon -> false, workers -> autoscale 5-10 LEGACY.
      serverless: false
      photon: true
      clusters:
        - label: default
          node_type_id: r5d.8xlarge
          driver_node_type_id: r5d.8xlarge
          num_workers: 20
      continuous: false
      development: false
      edition: ADVANCED
      channel: CURRENT
      configuration:
        environment: prod
        pipelines.clusterShutdown.delay: 300s
        spark.sql.legacy.timeParserPolicy: CORRECTED
        spark.sql.execution.arrow.maxRecordsPerBatch: "500"
      tags:
        environment: prod
        workflow: repo
      libraries:
        - notebook:
            path: ../notebooks/ingest/Repo.py
