# Repo DLT pipeline (fcd1ea61-2e07-433b-90ad-b3b0a0960158).
# Bundle-managed: notebook code deploys via CI on push to main — do NOT pull the
# /Shared/openalex-walden Git folder for this pipeline; edits made in the pipeline UI
# (settings AND code) are reverted on the next deploy.
#
# FULL REFRESH cautions:
#   - repo full refreshes are S3-listing-bound and can take DAYS (oxjob #546 small-files).
#   - ingested_at is the S3 object mtime as of oxjob #911 (arrival time, stable across
#     re-reads), so a full refresh no longer restamps the corpus to now() — it backfills
#     pre-#911 rows to their true mtimes, which sit OUTSIDE TaxiCab's lookback window.
#     The #542 ingested_after guard is therefore legacy; keep it until the first
#     post-#911 full refresh verifies no flood.
resources:
  pipelines:
    repo_pipeline:
      name: Repo
      catalog: openalex
      target: repo
      # FULL-REFRESH PROFILE -- swap `serverless: true` for the block below, deploy, run the
      # refresh, then revert and deploy again. Measured 3h22m -> 1h04m on 08-06 from the
      # cluster change ALONE (maxRecordsPerBatch was left at 500 for that run):
      #
      #   serverless: false
      #   photon: true
      #   clusters:
      #     - label: default
      #       node_type_id: r5d.8xlarge
      #       driver_node_type_id: r5d.8xlarge
      #       num_workers: 20
      #
      # ...and raise arrow.maxRecordsPerBatch in `configuration` below at the same time.
      # 500 is a serverless-era memory guard, never chosen for Repo deliberately -- it was
      # inherited from the pre-bundle live pipeline (see 1fd4c45e on the sibling DataCite
      # Awards pipeline: "likely set during initial tuning to limit memory under PyArrow
      # conversion (default is 10000)"). r5d.8xlarge has 256 GiB a node, so 500 throttles
      # every Pandas UDF in repo_enriched -- author last-name parsing, abstract cleaning +
      # inverted index, title cleaning, best_type_udf -- for little benefit on that hardware.
      # UNTESTED: step it up (2000 -> 4000), do not jump straight to the 10000 default. The
      # known OOM in this path was the whole-authors-array JSON round-trip on hyperauthorship
      # works; that specific bug is fixed, but it is the reason to be incremental.
      # TEMPORARY (oxjob #911): full-refresh profile ACTIVE for the repo_items full refresh
      # (ingested_at backfill to S3 mtimes). REVERT to `serverless: true` (and
      # maxRecordsPerBatch to "500") when the refresh completes and row counts verify.
      # Stage 1 (repo_items S3 re-ingest, photon off) COMPLETED 2026-08-28 10:21 UTC in
      # ~6h at 60 workers -- the binding constraint was cloudFiles.maxFilesPerTrigger
      # (see Repo.py), not cores or photon. Photon back ON for stage 2: the repo_works-only
      # rebuild is Delta scan/merge/write, which photon does accelerate.
      serverless: false
      photon: true
      clusters:
        - label: default
          node_type_id: r5d.8xlarge
          driver_node_type_id: r5d.8xlarge
          num_workers: 60
      continuous: false
      development: false
      edition: ADVANCED
      channel: CURRENT
      configuration:
        environment: prod
        pipelines.clusterShutdown.delay: 300s
        spark.sql.legacy.timeParserPolicy: CORRECTED
        # 500 for serverless steady state; raise with the full-refresh profile above.
        # (2000 ran clean through the 2026-08-26 refreshes -- the ladder's first rung is proven.)
        # TEMPORARY (oxjob #911): 2000 for the refresh window, same as the #881 runs.
        spark.sql.execution.arrow.maxRecordsPerBatch: "2000"
      tags:
        environment: prod
        workflow: repo
      libraries:
        - notebook:
            path: ../notebooks/ingest/Repo.py
