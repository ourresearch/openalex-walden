          pipeline_task:
            pipeline_id: b362fe01-3cb7-40de-9c52-e35f02eea548
            full_refresh: false
          timeout_seconds: 14400
          max_retries: 1
          min_retry_interval_millis: 300000
        - task_key: Unpaywall_Lakebase_Export_Metadata
          depends_on:
