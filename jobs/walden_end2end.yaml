resources:
  jobs:
    Walden_End_2_End:
      name: Walden End 2 End
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      schedule:
        quartz_cron_expression: 0 0 5 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: Crossref_Ingest_DLT
          pipeline_task:
            pipeline_id: 7def27a3-968c-4b1a-864b-0fc308756721
            full_refresh: false
          max_retries: 3
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 3600
        - task_key: DataCite_Ingest_DLT
          pipeline_task:
            pipeline_id: e5d95673-98e3-47db-8630-48a7739304cc
            full_refresh: false
          max_retries: 3
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 3600
        - task_key: Parseland
          timeout_seconds: 28500
          notebook_task:
            notebook_path: notebooks/scraping/parseland
            source: GIT
            # No retries of failed parses on the night's critical path (oxjob #1642, 5 Nov 2026): #1997's 50K retries (the
            # corpus's heaviest pages) held all 100 Parseland tasks at 99% CPU and ran this step 59 min (median 13). The
            # LandingPageWork job (03:00 / 11:00 CT, same notebook, default 50000) still retries them, off the critical path.
            base_parameters:
              retry_parse_limit: "0"
          job_cluster_key: parseland_cluster
        - task_key: Landing_Page_Ingest_DLT
          depends_on:
            - task_key: Parseland
          pipeline_task:
            pipeline_id: ff5e63c2-b1b8-49c2-a7c0-2ee246e89e69
            full_refresh: false
          max_retries: 3
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 3600
        - task_key: PDF_Ingest_DLT
          pipeline_task:
            pipeline_id: 4b35274b-82f2-41f8-aa4a-87890d282134
            full_refresh: false
          max_retries: 3
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 3600
        - task_key: PubMed_Ingest_DLT
          pipeline_task:
            pipeline_id: d327518b-e3e0-484c-a214-c7326f3e51fe
            full_refresh: false
          max_retries: 3
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 3600
        - task_key: Repos_Ingest_DLT
          pipeline_task:
            pipeline_id: fcd1ea61-2e07-433b-90ad-b3b0a0960158
            full_refresh: false
          max_retries: 3
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 3600
        - task_key: Union
          timeout_seconds: 2700
          depends_on:
            - task_key: Crossref_Ingest_DLT
            - task_key: PubMed_Ingest_DLT
            - task_key: Repos_Ingest_DLT
            - task_key: PDF_Ingest_DLT
            - task_key: DataCite_Ingest_DLT
            - task_key: Landing_Page_Ingest_DLT
          pipeline_task:
            pipeline_id: bd9dfc4f-7b7f-42a2-b01b-8101c5ab19d5
            full_refresh: false
          max_retries: 3
          min_retry_interval_millis: 300000
          retry_on_timeout: true
        - task_key: Crossref_Super_Authorships
          timeout_seconds: 1200
          depends_on:
            - task_key: Union
          notebook_task:
            notebook_path: notebooks/end2end/CreateCrossrefSuperAuthorships
            source: GIT
            warehouse_id: 4d37bf76372a2901
        - task_key: Repo_Super_Authorships
          timeout_seconds: 1200
          depends_on:
            - task_key: Union
          notebook_task:
            notebook_path: notebooks/end2end/CreateRepoSuperAuthorships
            source: GIT
            warehouse_id: 4d37bf76372a2901
        - task_key: Superlocations
          timeout_seconds: 2100
          depends_on:
            - task_key: Repo_Super_Authorships
            - task_key: Crossref_Super_Authorships
          notebook_task:
            notebook_path: notebooks/end2end/CreateSuperLocations
            source: GIT
            warehouse_id: 4d37bf76372a2901
        # Refresh openalex.sources.sources from the federated registry at the top of
        # every run (oxjob #548): end2end and the standalone 05:00 Sources job shared
        # a cron, so this run's consumers raced a snapshot that could be a day stale.
        # Same CreateSources notebook — single source of truth for the legacy shape.
        - task_key: Sources_Snapshot
          timeout_seconds: 1800
          retry_on_timeout: true
          notebook_task:
            notebook_path: notebooks/sources/CreateSources
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
          max_retries: 2
          min_retry_interval_millis: 300000
        - task_key: Locations_with_Sources
          timeout_seconds: 1800
          depends_on:
            - task_key: Superlocations
            - task_key: Sources_Snapshot
          notebook_task:
            notebook_path: notebooks/end2end/CreateLocationsWithSources
            source: GIT
            warehouse_id: 4d37bf76372a2901
        - task_key: Locations_with_Types
          timeout_seconds: 1200
          depends_on:
            - task_key: Locations_with_Sources
          notebook_task:
            notebook_path: notebooks/end2end/CreateLocationsWithTypes
            source: GIT
            warehouse_id: 4d37bf76372a2901
          max_retries: 3
          min_retry_interval_millis: 300000
          retry_on_timeout: true
        # oxjob #1099, #1057: merge works whose declared link appeared after both were pinned, one class per kind of link (preprint <-> article:
        # Crossref is-preprint-of / has-preprint, arXiv DataCite IsVersionOf; part_of off since 2026-10-27); MapWorkIds then
        # re-resolves the losers' records onto the winner in this run.
        - task_key: Merge_Declared_Links
          depends_on:
            - task_key: Locations_with_Types
          notebook_task:
            notebook_path: notebooks/end2end/MergeDeclaredLinks
            source: GIT
            warehouse_id: 4d37bf76372a2901
          timeout_seconds: 2400
        # Passes whether the merge succeeded, failed or timed out: MapWorkIds runs either way.
        - task_key: Merge_Declared_Links_Gate
          timeout_seconds: 1200
          depends_on:
            - task_key: Merge_Declared_Links
          run_if: ALL_DONE
          # Fails only when Merge_Declared_Links never ran (upstream failed), so a repair re-runs this gate after it.
          sql_task:
            warehouse_id: 4d37bf76372a2901
            file:
              path: notebooks/end2end/gate_guarded_task_ran.sql
              source: GIT
            parameters:
              guarded_state: "{{tasks.Merge_Declared_Links.result_state}}"
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
        # oxjob #764 / #1668: every location that needs a work tonight gets one, matched by identifier, by the location matcher
        # (first-sight records nothing else matched, Casey 2026-11-01) or minted. A run of the Map Work Ids workflow; when any of
        # its steps cannot run in full this task fails and the run stops here, and a repair reruns the whole workflow (nothing is
        # pinned before its last step).
        - task_key: Map_Work_Ids
          timeout_seconds: 21600
          depends_on:
            - task_key: Locations_with_Types
            - task_key: Merge_Declared_Links_Gate
          run_job_task:
            job_id: ${resources.jobs.Map_Work_Ids.id}
        - task_key: Locations_Mapped
          timeout_seconds: 1500
          depends_on:
            - task_key: Map_Work_Ids
          notebook_task:
            notebook_path: notebooks/end2end/CreateLocationsMapped
            source: GIT
            warehouse_id: 4d37bf76372a2901
        # oxjob #1170: location curations from users-api POST /curations, read by Apply_Location_Curations.
        - task_key: Sync_Location_Curations
          timeout_seconds: 1200
          max_retries: 1
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: notebooks/end2end/SyncLocationCurations
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
        - task_key: Apply_Location_Curations
          timeout_seconds: 1200
          depends_on:
            - task_key: Locations_Mapped
            - task_key: Sync_Location_Curations
          notebook_task:
            notebook_path: notebooks/end2end/ApplyLocationCurations
            source: GIT
            warehouse_id: 4d37bf76372a2901
        - task_key: parse_referenced_works
          # 4-6 min until oxjob #2054; per-list filing adds the list check (~15 min in the 10% rehearsal, scaled). Off the
          # critical path: Works_Enriched also waits for the author steps, which take hours.
          timeout_seconds: 3600
          depends_on:
            - task_key: Works_Base
          notebook_task:
            notebook_path: notebooks/parsing/parse_work_references
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
        - task_key: Work_Volumes
          timeout_seconds: 1200
          depends_on:
            - task_key: Map_Work_Ids
          notebook_task:
            notebook_path: notebooks/end2end/CreateWorkVolumes
            source: GIT
            warehouse_id: 4d37bf76372a2901
        - task_key: Works_Base
          timeout_seconds: 3000
          depends_on:
            - task_key: Apply_Location_Curations
            - task_key: Work_Volumes
          notebook_task:
            notebook_path: notebooks/end2end/CreateWorksBase
            source: GIT
            warehouse_id: 4d37bf76372a2901
        # oxjob #2065: which works each work is part of (chapter -> book, DataCite IsPartOf): parent_works, lineage,
        # child_works_count, merged onto the work by Works_Enriched. Needs tonight's live works, types and titles, so it
        # follows Works_Base. ~3 min on a 4X-Large; off the critical path (the author steps take hours).
        - task_key: Work_Parents
          timeout_seconds: 1800
          max_retries: 1
          depends_on:
            - task_key: Works_Base
          notebook_task:
            notebook_path: notebooks/end2end/CreateWorkParents
            source: GIT
            warehouse_id: 4d37bf76372a2901
        # oxjob #2006: one "merged away -> live winner" map for every reader inside the night. Built from tonight's live
        # set (openalex_works_base) once all of the day's merges and MergeDeclaredLinks' are in merged_work_ids; the
        # snapshot's refresh_merged_works_map rebuilds it after Track_Deleted_Works (adds tonight's auto_emptied rows) and
        # mirrors it into ES. Readers: Apply_Work_Author_Curations (claims, #2008), Works_Enriched (citations cells 5-6,
        # funders cell 20).
        # Off the critical path (the author steps take hours); ~20-25 min.
        - task_key: Merged_Work_Ids_Map
          timeout_seconds: 5400
          depends_on:
            - task_key: Works_Base
          notebook_task:
            notebook_path: notebooks/elastic/sync_merged_ids
            source: GIT
            base_parameters:
              entity: works
              live_table: openalex.works.openalex_works_base
              es_mirror: "false"
          max_retries: 1
          min_retry_interval_millis: 300000
        - task_key: Works_Fulltext
          timeout_seconds: 1200
          depends_on:
            - task_key: Works_Base
          notebook_task:
            notebook_path: notebooks/end2end/CreateWorkFulltext
            source: GIT
            warehouse_id: 4d37bf76372a2901
        - task_key: Parsed_Author_Names
          timeout_seconds: 1200
          depends_on:
            - task_key: Works_Base
          notebook_task:
            notebook_path: notebooks/end2end/CreateAuthorNames
            source: GIT
        - task_key: Prepare_Affiliation_Strings
          timeout_seconds: 1200
          depends_on:
            - task_key: Works_Base
          notebook_task:
            notebook_path: notebooks/end2end/PrepareAffiliationStrings
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
        - task_key: Sync_RAS_Curations
          timeout_seconds: 10800
          max_retries: 1
          min_retry_interval_millis: 60000
          depends_on:
            - task_key: Works_Base
          notebook_task:
            notebook_path: notebooks/end2end/SyncRasCurations
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
        - task_key: Sync_Work_Author_Curations
          timeout_seconds: 14400
          max_retries: 1
          min_retry_interval_millis: 60000
          depends_on:
            - task_key: Works_Base
          notebook_task:
            notebook_path: notebooks/end2end/SyncWorkAuthorCurations
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
        # oxjob #1386: the new affiliation matcher on tonight's new strings, in parallel with Sync_RAS_Curations.
        - task_key: Affiliation_Matcher_Nightly
          depends_on:
            - task_key: Prepare_Affiliation_Strings
          run_job_task:
            job_id: ${resources.jobs.Affiliation_Matcher_Nightly.id}
          timeout_seconds: 3000
        # Passes whether the matcher succeeded, failed or timed out: its strings then keep the legacy answer.
        - task_key: Affiliation_Matcher_Gate
          timeout_seconds: 1200
          depends_on:
            - task_key: Affiliation_Matcher_Nightly
          run_if: ALL_DONE
          # Fails only when Affiliation_Matcher_Nightly never ran (upstream failed), so a repair re-runs this gate after it.
          sql_task:
            warehouse_id: 4d37bf76372a2901
            file:
              path: notebooks/end2end/gate_guarded_task_ran.sql
              source: GIT
            parameters:
              guarded_state: "{{tasks.Affiliation_Matcher_Nightly.result_state}}"
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
        - task_key: Institutions_Frontfill
          timeout_seconds: 3300
          depends_on:
            - task_key: Prepare_Affiliation_Strings
            - task_key: Sync_RAS_Curations
            - task_key: Affiliation_Matcher_Gate
          run_job_task:
            job_id: 637771147662119
          max_retries: 2
          min_retry_interval_millis: 600000
        # oxjob #1300: SDG_Frontfill (Aurora on the sdg-classifier endpoint, job 27479127407344) removed. The
        # Jev-trained head replaced Aurora; new works are scored by task sdg_score of Embed_Qwen3_Nightly.
        - task_key: Topics
          timeout_seconds: 18600
          depends_on:
            - task_key: Works_Base
          run_job_task:
            job_id: 107953357639482
          max_retries: 2
          min_retry_interval_millis: 600000
        - task_key: Concepts
          timeout_seconds: 5100
          depends_on:
            - task_key: Works_Base
          run_job_task:
            job_id: 948457692151163
          max_retries: 2
          min_retry_interval_millis: 600000
        - task_key: Author_Affiliations
          timeout_seconds: 1200
          depends_on:
            - task_key: Parsed_Author_Names
            - task_key: Institutions_Frontfill
            # oxjob #608: guard's curated flag reads work_author_claim_curations —
            # must not race the sync's full MERGE
            - task_key: Sync_Work_Author_Curations
          notebook_task:
            notebook_path: notebooks/end2end/UpdateWorkAuthors
            source: GIT
            warehouse_id: 4d37bf76372a2901
        # oxjob #1401 / #1348: vector matcher for tonight's new seats (seat-vector band + Claude Sonnet 5.5 zone judge) ->
        # openalex.authors.vector_match_decisions, which MatchAuthors cell 9 LEFT JOINs. Stopgap judge (~$540/night; charter § 6).
        - task_key: Vector_Matcher
          depends_on:
            - task_key: Author_Affiliations
            - task_key: Topics
          run_job_task:
            job_id: ${resources.jobs.Vector_Matcher_Nightly.id}
          timeout_seconds: 5400
        # Passes whether the vector matcher succeeded, failed or timed out: Author_Matching then runs on the name cascade alone.
        - task_key: Vector_Matcher_Gate
          timeout_seconds: 1200
          depends_on:
            - task_key: Vector_Matcher
          run_if: ALL_DONE
          # Fails only when Vector_Matcher never ran (upstream failed), so a repair re-runs this gate after it.
          sql_task:
            warehouse_id: 4d37bf76372a2901
            file:
              path: notebooks/end2end/gate_guarded_task_ran.sql
              source: GIT
            parameters:
              guarded_state: "{{tasks.Vector_Matcher.result_state}}"
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
        - task_key: Author_Matching
          timeout_seconds: 3900
          depends_on:
            - task_key: Author_Affiliations
            - task_key: Topics
            - task_key: Vector_Matcher_Gate
          notebook_task:
            notebook_path: notebooks/end2end/MatchAuthors
            source: GIT
            warehouse_id: 4d37bf76372a2901
        - task_key: Apply_Work_Author_Curations
          timeout_seconds: 3600  # never over 2.2 min so far, but 14 Oct doubled the curations (28.7M); generous until it has history
          depends_on:
            - task_key: Author_Matching
            - task_key: Sync_Work_Author_Curations
            - task_key: Merged_Work_Ids_Map
          notebook_task:
            notebook_path: notebooks/end2end/ApplyWorkAuthorCurations
            source: GIT
            warehouse_id: 4d37bf76372a2901
        - task_key: Authorships
          # oxjob #1642: on 8 and 9 Nov the main CREATE OR REPLACE TABLE work_authorships read all its input (4.43B rows,
          # 3.71 GB spill, 21 of its usual 24 task-hours) and then stalled until cancelled; a re-run took ~4 min. 25 min
          # (healthy task: 9-14 min) and one retry recover it without a person; worst case ~ the old single 40-min attempt.
          timeout_seconds: 1500
          max_retries: 1
          # oxjob #1642 (10-11 Nov): the main statement freezes on a warm cluster (8 of 8 attempts that started right after
          # Author_Matching on jobs-4xl, 8-11 Nov) and finishes in ~4 min on a cold one (9 of 9 starts after the warehouse had
          # auto-stopped). Databricks counts min_retry_interval_millis from the START of the failed attempt, so 150 s never
          # delayed a retry (11 Nov: 2 s after a 25-min attempt): wait the task limit + 150 s, by when its own warehouse
          # (auto-stop 1 min) has stopped. The notebook also caps the main statement at 12 min (STATEMENT_TIMEOUT 720).
          min_retry_interval_millis: 1650000
          retry_on_timeout: true
          depends_on:
            - task_key: Apply_Work_Author_Curations
          notebook_task:
            notebook_path: notebooks/end2end/CreateWorkAuthorships
            source: GIT
            # jobs-4xl-authorships (4X-Large, auto-stop 1 min), used by this task only, so every attempt starts cold.
            # Revert: 4d37bf76372a2901 (jobs-4xl).
            warehouse_id: 206883a966070d92
        - task_key: Works_Enriched
          timeout_seconds: 5700
          depends_on:
            - task_key: Authorships
            - task_key: Concepts
            - task_key: Works_Fulltext
            # referenced_works merge (cell 5) reads its output; Works_Base does not
            - task_key: parse_referenced_works
            # cells 5-6 redirect citations through merged_work_ids_map (oxjob #2006)
            - task_key: Merged_Work_Ids_Map
            # the parent/child merge reads work_parents (oxjob #2065)
            - task_key: Work_Parents
          notebook_task:
            notebook_path: notebooks/end2end/CreateWorksEnriched
            source: GIT
            warehouse_id: 4d37bf76372a2901
        - task_key: Optimize_Works_Enriched
          timeout_seconds: 1500
          depends_on:
            - task_key: Works_Enriched
          notebook_task:
            notebook_path: notebooks/end2end/OptimizeWorksEnriched
            source: GIT
            warehouse_id: 4d37bf76372a2901
        - task_key: Guardrails
          timeout_seconds: 1200
          depends_on:
            - task_key: Optimize_Works_Enriched
          notebook_task:
            notebook_path: notebooks/end2end/Guardrails
            base_parameters:
              # oxjob #1642 (13 Nov 2026): Check 1 counts every stamp since the run started (a repair keeps this value)
              run_start: "{{job.start_time.iso_datetime}}"
            source: GIT
        # oxjob #784: ledger works that vanished from openalex_works. Runs after
        # Guardrails so a pathological run is stopped before it can ledger the loss.
        # Feeds Delete_Works_from_Elasticsearch and the snapshot's deleted_ids.csv.
        - task_key: Track_Deleted_Works
          timeout_seconds: 1200
          depends_on:
            - task_key: Guardrails
          notebook_task:
            notebook_path: notebooks/end2end/TrackDeletedWorks
            source: GIT
          max_retries: 2
          min_retry_interval_millis: 300000
        # oxjob #850: ledger location ES ids that vanished from locations_mapped
        # (a nightly full rebuild — deleted rows just stop appearing, so ES needs
        # an explicit delete feed). Runs after Guardrails for the same reason as
        # Track_Deleted_Works. Feeds Delete_Locations_from_Elasticsearch.
        - task_key: Track_Deleted_Locations
          timeout_seconds: 1200
          depends_on:
            - task_key: Guardrails
          notebook_task:
            notebook_path: notebooks/end2end/TrackDeletedLocations
            source: GIT
          max_retries: 2
          min_retry_interval_millis: 300000
        - task_key: Full_Snapshot
          timeout_seconds: 15300
          depends_on:
            - task_key: Guardrails
            - task_key: Track_Deleted_Works
          run_job_task:
            job_id: ${resources.jobs.Full_Snapshot.id}
            job_parameters:
              # auto = the calendar rule in jobs/snapshot_full.yaml decides whether
              # this nightly's snapshot goes to the public bucket (oxjob #1323).
              public_release: "auto"
        - task_key: Sync_to_Elasticsearch
          timeout_seconds: 37200
          depends_on:
            - task_key: Guardrails
          notebook_task:
            notebook_path: notebooks/elastic/sync_works
            base_parameters:
              is_full_sync: "false"
            source: GIT
          job_cluster_key: es_sync_cluster
        # oxjob #915: nightly incremental locations sync; #850 made it
        # watermark-driven (elastic_sync_state, keyed locations).
        # Serialized after the works sync on the shared cluster.
        - task_key: Sync_Locations_to_Elasticsearch
          # oxjob #1642 (31 Oct 2026): 90 min timed out on night 2026-10-31 (43,980,449 re-stamped works on ONE daytime
          # writer: the works sync ran 07:31-10:36 CT, so this one ran 10:36-12:07 in US daytime). 30 Oct: 50 min for
          # 31.6M. Scale with the night: 4 h covers a 60M night on one writer; the stall alarm is the shepherd's watch.py.
          timeout_seconds: 14400
          depends_on:
            - task_key: Sync_to_Elasticsearch
          notebook_task:
            notebook_path: notebooks/elastic/sync_locations
            base_parameters:
              is_full_sync: "false"
            source: GIT
          job_cluster_key: es_sync_cluster
        # oxjob #850: the ES delete path sync_locations lacks — consumes the
        # deleted_locations ledger and removes the stale docs from locations.
        - task_key: Delete_Locations_from_Elasticsearch
          timeout_seconds: 1200
          depends_on:
            - task_key: Sync_Locations_to_Elasticsearch
            - task_key: Track_Deleted_Locations
          notebook_task:
            notebook_path: notebooks/elastic/delete_locations
            base_parameters:
              is_full_reconcile: "false"
            source: GIT
          job_cluster_key: es_sync_cluster
          max_retries: 2
          min_retry_interval_millis: 300000
        # oxjob #784: the ES delete path sync_works lacks — consumes the
        # deleted_works ledger and removes the stale docs from the works index (the `works` alias).
        - task_key: Delete_Works_from_Elasticsearch
          timeout_seconds: 1200
          depends_on:
            - task_key: Sync_to_Elasticsearch
            - task_key: Track_Deleted_Works
          notebook_task:
            notebook_path: notebooks/elastic/delete_works
            base_parameters:
              is_full_reconcile: "false"
            source: GIT
          job_cluster_key: es_sync_cluster
          max_retries: 2
          min_retry_interval_millis: 300000
        # oxjob #2082: fwci and both percentiles move every night without re-stamping a work, so sync_works never re-sends
        # them. Partial updates of only those three fields for works past the lines (fwci 1%, CNP 0.01, percentile-year
        # 2 points), state in openalex.works.es_work_metrics_served. Last ES writer of the run (the shepherd's order,
        # 7 Nov): after both syncs and both deletes. Cap 10M a run (the rest waits a night); 24 bulk streams at night,
        # 6 after 07:00 CT (12 took the API probe p50 to 0.9 s at 10:15 CT Sat 7 Nov at 26 nodes).
        # Revert: delete this task.
        - task_key: Sync_Work_Metrics_to_Elasticsearch
          timeout_seconds: 14400
          depends_on:
            - task_key: Delete_Works_from_Elasticsearch
            - task_key: Delete_Locations_from_Elasticsearch
          notebook_task:
            notebook_path: notebooks/elastic/sync_work_metrics
            base_parameters:
              mode: "nightly"
              max_push: "10000000"
              writers: "24"
              day_writers: "6"
            source: GIT
          job_cluster_key: es_sync_cluster
        - task_key: Sync_Works_to_Lakebase
          depends_on:
            - task_key: Guardrails
          notebook_task:
            notebook_path: notebooks/lakebase/BuildLakebaseWorksDocs
            base_parameters:
              is_full_build: "false"
              trigger_syncs: "true"
              run_deletes: "false"
            source: GIT
          job_cluster_key: lakebase_sync_cluster
          timeout_seconds: 21600
        # oxjob #2082: single-work lookups (Lakebase) take fwci and both percentiles from a narrow synced table, since the
        # stored docs keep the values of each work's last re-stamp. Rows rewritten only past the lines (fwci 1%, CNP 0.01,
        # percentile-year 2 points), at most 20M a night. Revert: delete this task and set METRICS_OVERLAY = False in
        # openalex-elastic-api works/lakebase.py (or config var LAKEBASE_METRICS_OVERLAY=0).
        - task_key: Sync_Work_Metrics_to_Lakebase
          timeout_seconds: 7200
          depends_on:
            - task_key: Sync_Works_to_Lakebase
          notebook_task:
            notebook_path: notebooks/lakebase/BuildLakebaseWorkMetrics
            base_parameters:
              mode: "nightly"
              trigger_sync: "true"
              max_rows: "20000000"
            source: GIT
          job_cluster_key: lakebase_sync_cluster
        - task_key: Refresh_RAS_Counts
          timeout_seconds: 1200
          depends_on:
            - task_key: Guardrails
          notebook_task:
            notebook_path: notebooks/end2end/RefreshRasWorksCounts
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
        - task_key: Sync_RAS_to_Elasticsearch
          timeout_seconds: 13500
          depends_on:
            - task_key: Refresh_RAS_Counts
            - task_key: Sync_to_Elasticsearch
          notebook_task:
            notebook_path: notebooks/elastic/sync_raw_affiliation_strings
            base_parameters:
              is_full_sync: "false"
            source: GIT
          job_cluster_key: es_sync_cluster
        # oxjob #2007: the apply receipt. What walden did with each users-api curation tonight (applied, outranked,
        # ignored by policy, target gone), for the users-api status worker. Last on purpose: a receipt exists only for a
        # night that passed Guardrails and reached Elasticsearch. Nothing depends on it, it re-stamps no works, and a
        # failure here leaves the night's publish untouched (repair-run this task alone).
        - task_key: Curation_Receipts
          timeout_seconds: 3600
          depends_on:
            - task_key: Delete_Works_from_Elasticsearch
            - task_key: Sync_RAS_to_Elasticsearch
          notebook_task:
            notebook_path: notebooks/end2end/CurationReceipts
            base_parameters:
              run_date: "{{job.start_time.iso_date}}"
              job_run_id: "{{job.run_id}}"
            source: GIT
            warehouse_id: 4d37bf76372a2901
        - task_key: Wunpaywall
          timeout_seconds: 1200
          depends_on:
            - task_key: Guardrails
          notebook_task:
            notebook_path: notebooks/end2end/CreateWunpaywall
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
        - task_key: Wunpaywal_Data_Feed
          timeout_seconds: 2100
          depends_on:
