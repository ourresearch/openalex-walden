            kind: CLASSIC_PREVIEW
            is_single_node: true
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      # Every parameter here but the last (reason) is a circuit-breaker bypass. Job parameters propagate to
      # every notebook task automatically, so no task re-declares them; each notebook
      # reads the widget under exactly this name. One switch per consequence class —
      # The parameter "true" (a manual run-now) opens its class's gates. The SCHEDULED nightly
      # instead reads pre-clear rows in openalex.works.e2e_overrides bound to its run
      # (scripts/preclear_e2e.py): a row raises only the checks it names, to the numbers it
      # names, read through openalex.works.e2e_cap / e2e_gate (notebooks/end2end/e2e_gate.sql,
      # oxjob #2005); see docs/runbooks/end2end-guardrails-override.md.
      # bypassing a quality gate must never authorize a mass delete or an oversized feed.
      #
      #   guardrails_override               Guardrails (each check; a row names max_changed /
      #                                     max_loss per metric), the curation decline gates in
      #                                     SyncWorkAuthorCurations / SyncLocationCurations
      #                                     (max_loss work_author_curations / location_curations);
      #                                     the parameter alone opens BuildLakebaseWorksDocs' floors
      #   deleted_works_guard_override      works gone > guard_fraction of live:
      #                                     TrackDeletedWorks, delete_works, BuildLakebaseWorksDocs' gone-works delete
      #   deleted_locations_guard_override  same rule for locations:
      #                                     TrackDeletedLocations, delete_locations
      #   wunpaywall_guard_override         export-volume caps: WunpaywallDataFeed
      #                                     (WunpaywallToOpenAlexDB, the RDS loader, was removed when openalex-1 was retired)
      parameters:
        - name: guardrails_override
          default: "false"
        - name: deleted_works_guard_override
          default: "false"
        - name: deleted_locations_guard_override
          default: "false"
        - name: wunpaywall_guard_override
          default: "false"
        # Not a bypass (oxjob #1642): a manual run, any run the 05:00 UTC schedule didn't start, says why here as
        # '<oxjob>: <why>, <who>'. Databricks records the service principal as every run's creator, so this is the only
        # place the starter's name and reason travel with the run; the nightly shepherd copies it into its record.
        # No task reads it.
        - name: reason
          default: ""
      performance_target: PERFORMANCE_OPTIMIZED
