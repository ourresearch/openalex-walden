resources:
  jobs:
    Sync_Sources_to_Elasticsearch:
      name: Sync Sources to Elasticsearch
      schedule:
        quartz_cron_expression: 0 0 10 ? * *
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: create_sources_api
          notebook_task:
            notebook_path: notebooks/sources/CreateSourcesApi
            base_parameters:
              guardrails_override: "{{job.parameters.guardrails_override}}"
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
        - task_key: sync_sources_to_elasticsearch
          depends_on:
            - task_key: create_sources_api
          notebook_task:
            notebook_path: notebooks/elastic/sync_sources
            source: GIT
        # oxjob #1124: refresh the merged-source map right after the sync removes merged-away sources, so a
        # source merged yesterday resolves from ~05:20 CT (was 09:30 CT in Sync Merged IDs to Elasticsearch)
        - task_key: merged_sources
          depends_on:
            - task_key: sync_sources_to_elasticsearch
          notebook_task:
            notebook_path: notebooks/elastic/sync_merged_ids
            source: GIT
            base_parameters:
              entity: sources
          max_retries: 1
          min_retry_interval_millis: 300000
          timeout_seconds: 3600
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      parameters:
        - name: guardrails_override
          default: "false"
      performance_target: STANDARD

