# DataCite DLT pipeline (e5d95673-98e3-47db-8630-48a7739304cc).
# Bundle-managed: notebook code deploys via CI on push to main — do NOT pull the
# /Shared/openalex-walden Git folder for this pipeline; edits made in the pipeline UI
# (settings AND code) are reverted on the next deploy.
resources:
  pipelines:
    datacite_pipeline:
      name: DataCite
      catalog: openalex
      target: datacite
      serverless: false
      photon: false
      clusters:
        - label: default
          node_type_id: r5d.8xlarge
          driver_node_type_id: r5d.8xlarge
          autoscale:
            min_workers: 5
            max_workers: 10
            mode: LEGACY
      continuous: false
      development: true
      edition: ADVANCED
      channel: CURRENT
      configuration:
        environment: prod
        pipelines.clusterShutdown.delay: 300s
        spark.sql.execution.arrow.maxRecordsPerBatch: "100"
        spark.sql.files.maxPartitionBytes: 32m
      tags:
        environment: prod
        workflow: datacite
      libraries:
        - notebook:
            path: ../notebooks/ingest/DataCite.py
