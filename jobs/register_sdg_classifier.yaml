resources:
  jobs:
    Register_SDG_Classifier:
      name: Register SDG Classifier
      description: |
        oxjob #966: register a new version of openalex.works.sdg_classifier from the Aurora
        mBERT SavedModel + tokenizer in /Volumes/openalex/works/models/sdg.

        MANUAL TRIGGER ONLY — no schedule. Run it whenever the served pyfunc changes.
        The notebook checks score parity of the dynamic-length path against the SavedModel's
        fixed-512 signature on real works and (with register=auto) registers only on a pass.

        This job does the FIRST half only: it creates a model version that serves no traffic.
        Promoting a version to the sdg-classifier endpoint is deliberately NOT part of this
        job — that step is production-affecting and stays a separate, explicit action:
          w.serving_endpoints.update_config(
              name="sdg-classifier",
              served_entities=[ServedEntityInput(
                  entity_name="openalex.works.sdg_classifier",
                  entity_version="N", workload_size="Small",
                  workload_type=ServingModelWorkloadType.GPU_MEDIUM,
                  scale_to_zero_enabled=True)])
        Rollback is the same call with the previous version. Requires an ML runtime.
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      max_concurrent_runs: 1
      tasks:
        - task_key: register_sdg_classifier
          job_cluster_key: register-cpu-ml
          notebook_task:
            notebook_path: notebooks/sdg/register_sdg_classifier
            source: GIT
            base_parameters:
              register: auto
              parity_rows: "1000"
      job_clusters:
        - job_cluster_key: register-cpu-ml
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-cpu-ml-scala2.12
            node_type_id: m5d.2xlarge
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.master: "local[*]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
            num_workers: 0
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: STANDARD
