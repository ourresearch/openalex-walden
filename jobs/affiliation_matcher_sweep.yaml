# oxjob #1393: when OpenAlex mints institutions from a new ROR dump, re-match the existing strings that could name
# them, so old works (and new works reusing an old string) get the new institution at the next End 2 End.
# Daily at 09:00 CT: after institutions_api picks up the Institutions job's mints (00:56 CT) and clear of End 2 End's
# matcher window. `check` is seconds on serverless; the GPU tasks run only on days with unswept institutions (a ROR
# dump every 2-4 weeks). The match step runs as 6 shards on 6 GPU clusters; Jev (50 req/s per shard, 300 in all, under
# the account's 400) is the limit: the Sep 2026 rehearsal implies ≈ 2.3M candidates, ≈ 6.5M Jev calls, ≈ 6-8 h and
# ≈ $250 ($160 Jev) for a dump that size (oxjob #1393 EXPLORE § 10). Code and measurements: notebooks/institutions/AffiliationMatcherSweep.py,
# utils/affiliation_matcher/sweep.py.
resources:
  jobs:
    Affiliation_Matcher_New_Institutions_Sweep:
      name: Affiliation Matcher New Institutions Sweep
      schedule:
        quartz_cron_expression: "0 0 9 * * ?"
        timezone_id: America/Chicago
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - casey@ourresearch.org
        no_alert_for_skipped_runs: true
      max_concurrent_runs: 1
      timeout_seconds: 43200
      tasks:
        - task_key: check
          notebook_task:
            notebook_path: notebooks/institutions/AffiliationMatcherSweep
            source: GIT
            base_parameters:
              step: check
          environment_key: Default
          timeout_seconds: 1800
        - task_key: any_pending
          depends_on:
            - task_key: check
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.check.values.pending}}"
            right: "0"
        - task_key: search
          depends_on:
            - task_key: any_pending
              outcome: "true"
          notebook_task:
            notebook_path: notebooks/institutions/AffiliationMatcherSweep
            source: GIT
            base_parameters:
              step: search
          job_cluster_key: matcher-gpu-0
          timeout_seconds: 7200
        - task_key: match_0
          depends_on:
            - task_key: search
          notebook_task:
            notebook_path: notebooks/institutions/AffiliationMatcherNightly
            source: GIT
            base_parameters:
              queue_table: openalex.institutions.affiliation_matcher_sweep_queue
              shard: "0/6"
              target_table: openalex.institutions.affiliation_matcher_sweep_answers_0
              sweep_ids_table: openalex.institutions.affiliation_matcher_sweep_ids
              cards: live
              require_swap: "false"
              max_strings: "5000000"
              max_minutes: "600"
              jev_deadline_min: "540"
              jev_rps: "50"
              jev_threads: "48"
              max_usd: "60"
          job_cluster_key: matcher-gpu-0
          timeout_seconds: 39600
