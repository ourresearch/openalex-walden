# PDF DLT pipeline (4b35274b-82f2-41f8-aa4a-87890d282134).
# Bundle-managed: notebook code deploys via CI on push to main — do NOT pull the
# /Shared/openalex-walden Git folder for this pipeline; edits made in the pipeline UI
# (settings AND code) are reverted on the next deploy.
resources:
  pipelines:
    pdf_pipeline:
      name: PDFWork
      catalog: openalex
      target: pdf
      # TEMPORARY (#789 Stage 0.5 full refresh): classic r5d.8xlarge 10-30 autoscale —
      # union-refresh runbook sizing. Photon off: the load is
      # pandas-UDF XML extraction, which photon does not accelerate.
      # REVERT to serverless+photon after the refresh completes.
      serverless: false
      photon: false
      clusters:
        - label: default
          node_type_id: r5d.8xlarge
          driver_node_type_id: r5d.8xlarge
          autoscale:
            min_workers: 10
            max_workers: 30
            mode: LEGACY
      continuous: false
      development: true
      edition: ADVANCED
      channel: CURRENT
      configuration:
        environment: prod
        pipelines.clusterShutdown.delay: 300s
        spark.sql.execution.arrow.maxRecordsPerBatch: "1000"
      tags:
        environment: prod
        workflow: pdf
      libraries:
        - notebook:
            path: ../notebooks/ingest/PDF.py
