# oxjob #1104: PubMed's book records (NCBI Bookshelf chapters such as StatPearls and GeneReviews, ~40K) are not in NLM's
# baseline/update files, so this job fetches them through E-utilities into s3://openalex-ingest/pubmed_books/<date>/,
# which the PubMed pipeline (notebooks/ingest/PubMed.py, book flow) reads. First run: every book record (~15 min at
# NCBI's 3 requests/s); after that, records modified since the last run (a handful a day). Daily, before End 2 End.
resources:
  jobs:
    PubMed_Books:
      name: PubMed Books
      schedule:
        quartz_cron_expression: 0 0 3 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - casey@ourresearch.org
        no_alert_for_skipped_runs: true
      max_concurrent_runs: 1
      tasks:
        - task_key: harvest_pubmed_books
          notebook_task:
            notebook_path: notebooks/ingest/PubMedBooksHarvest
            source: GIT
          environment_key: Default
          max_retries: 1
          min_retry_interval_millis: 600000
          timeout_seconds: 5400
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
