resources:
  jobs:
    Flag_Location_Not_Abstracts:
      name: Flag Location Not Abstracts
      description: |
        oxjob #1800: build openalex.abstracts.not_abstract_texts, the distinct abstract texts in
        openalex.works.locations_parsed (Crossref, repository, DataCite, PubMed, PDF and landing-page
        records) that parseland-lib's not_abstract.is_not_abstract rejects ("No abstract available.",
        "-", site blurbs, SEO templates), keyed by xxhash64 + length. CreateSuperLocations NULLs those
        abstracts (owner guard on hand-read list texts), so selection falls through to the next source.

        MANUAL TRIGGER ONLY: re-run when the filter changes (new parseland-lib commit: upload its two
        files to the Volume, bump FILTER_COMMIT and the hashes in the notebook) or to catch new per-record
        templates. Known junk texts on new records are caught nightly by the hash key without a re-run.
        INSERT OVERWRITE keeps the table present throughout; never DROP it while CreateSuperLocations
        reads it.
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      max_concurrent_runs: 1
      tasks:
        - task_key: flag_location_not_abstracts
          notebook_task:
            notebook_path: notebooks/maintenance/FlagLocationNotAbstracts
            source: GIT
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: STANDARD
