# Nightly refresh of the semantic-search vectors (oxjob #1275). Five tasks:
#   1. embed  — EmbedQwen3Incremental: new/changed/missing works → work_embeddings_qwen3 (serverless, ai_query)
#   2. stage  — stage_vector_sync_qwen3.sql on the serverless SQL warehouse: rows embedded in the last 2 days, joined to
#               their filter fields and filter_hash → vector_sync_staging_qwen3
#   3. sync   — sync_vector_index_qwen3 incremental: ships the staging table to ES works-vectors (v3 since 10 Oct), then records the sent
#               hashes in the mirror vector_filter_fields_sent. Works whose filter fields change without a text change,
#               and works that no longer exist, go out at 00:45 CT in vector_filter_sync_qwen3.yaml (oxjob #1433)
#   4. sdg_score — sdg_jev_head_score incremental (oxjob #1300): scores the vectors just embedded with the Jev-trained
#               SDG head → openalex.works.works_sdg_jev, which the next Walden End 2 End merges into
#               sustainable_development_goals. Runs beside stage/sync, so a failure never holds up the vectors.
#   5. related_works — RelatedWorksIncremental (oxjob #1648): related works for the works that have a vector but no list
#               (tonight's new works; re-embedded works only if reembed_cap > 0, default 0) -> openalex.works.work_related_works, which the next
#               Walden End 2 End serves (CreateWorksEnriched). One scan of work_vectors_ivf on its own cluster, ~$3-5; fails before
#               writing if tonight's recall@10 is under min_recall. Runs beside the other tasks, so a failure holds up nothing.
# The sync only runs if the embed task succeeds. All four are idempotent; a failed run is simply re-run.
resources:
  jobs:
    Embed_Qwen3_Nightly:
      name: Embed works with Qwen3 + sync to ES (nightly, oxjob #1275)
      description: |
        Keeps openalex.vector_search.work_embeddings_qwen3 and the ES index works-vectors (alias; works-vectors-v3) current.
        Embeds works whose title/abstract/venue changed in the last lookback_days plus any titled work
        without a vector (documents bare, no instruction prefix), then runs the Qwen3 ES sync in
        incremental mode over rows embedded in the last sync_lookback_days.
        ~300K new works/day ≈ a few minutes of embedding, ≈$1/day endpoint + the sync job cluster
        (~20 min). Scheduled 15:00 UTC: Walden End 2 End starts 05:00 UTC and lands 11:00–13:30 UTC,
        so the night's new works are in openalex_works by then. Must not overlap the bulk
        runner or a full sync (job "Sync Vector Index to Elasticsearch (Qwen3, oxjob #1275)").
      email_notifications:
        on_failure:
          - jason@ourresearch.org
        no_alert_for_skipped_runs: true
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 15 * * ?"   # daily 15:00 UTC, after Walden End 2 End lands
        timezone_id: UTC
        pause_status: UNPAUSED
      parameters:
        - name: lookback_days
          default: "3"
        - name: sync_lookback_days
          default: "2"
        - name: parallel
          default: "4"
        - name: max_works
          default: "50000000"
      tasks:
        - task_key: embed
          notebook_task:
            notebook_path: notebooks/vector_search/EmbedQwen3Incremental
            source: GIT
            base_parameters:
              lookback_days: "{{job.parameters.lookback_days}}"
              parallel: "{{job.parameters.parallel}}"
              max_works: "{{job.parameters.max_works}}"
          environment_key: Default
          timeout_seconds: 43200
        # oxjob #1300: the SDG head on tonight's new vectors (a few hundred K works, minutes)
        - task_key: sdg_score
          depends_on:
            - task_key: embed
          notebook_task:
            notebook_path: notebooks/sdg/sdg_jev_head_score
            source: GIT
            base_parameters:
              mode: incremental
          environment_key: Default
          timeout_seconds: 7200
        # oxjob #1648: related works for tonight's new and re-embedded works (minutes; one scan of the vector table)
        - task_key: related_works
          depends_on:
            - task_key: embed
          notebook_task:
            notebook_path: notebooks/vector_search/RelatedWorksIncremental
            source: GIT
            base_parameters:
              mode: write
          job_cluster_key: related_works_cluster
          timeout_seconds: 10800
        - task_key: stage
          depends_on:
            - task_key: embed
          sql_task:
            warehouse_id: 8d889de6cd2f2cee   # vector-pipeline: serverless Medium, 1-2 clusters, only the vector jobs (oxjob #1433; the shared serverless warehouse queued the stage 2 h on 10 Oct)
            file:
              path: notebooks/elastic/stage_vector_sync_qwen3.sql
              source: GIT
          timeout_seconds: 7200
        - task_key: sync
          depends_on:
            - task_key: stage
          notebook_task:
            notebook_path: notebooks/elastic/sync_vector_index_qwen3
            source: GIT
            base_parameters:
              is_full_sync: "false"
              lookback_days: "{{job.parameters.sync_lookback_days}}"   # only used if the stage task's table is missing
          job_cluster_key: vector_sync_cluster
          timeout_seconds: 21600
      job_clusters:
        - job_cluster_key: related_works_cluster   # oxjob #1648: scans the 954 GB vector table once (~$3-5 a night)
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: rd-fleet.8xlarge
            driver_node_type_id: rd-fleet.8xlarge
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            spark_conf:
              spark.sql.execution.arrow.maxRecordsPerBatch: "8192"
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 8
        - job_cluster_key: vector_sync_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            aws_attributes:
              first_on_demand: 1
              availability: ON_DEMAND
              zone_id: auto
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: rd-fleet.12xlarge
            driver_node_type_id: rd-fleet.8xlarge
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:   # ~300K new works + 1–3M filter-field changes a night; cleanup weeks send tens of millions (#1433)
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
