# One-off, paced over several nights (oxjob #1433): re-send to works-vectors-v2 the 160.4M works whose filter fields went
# stale after the 21 Sep build (staging oxjob1433_refresh_staging, pinned to openalex_works VERSION 16676, 100 batches of
# ≈ 1.6M), then delete the 4.58M vector docs whose work is gone. Resumes from oxjob1433_refresh_checkpoint each night.
#
# Why paced: the vector cluster (2 nodes, 1.7 TB index, no replica) serves kNN from the page cache, and the merges that
# in-place overwrites set off evict it. Sending ≈ 40M docs in one evening on 29 Sep made semantic search fail 60-78% of
# requests and it took ≈ 90 min to recover. So each night sends at most max_batches, starts no batch after max_minutes,
# and before every batch waits for merges <= max_merges and a direct kNN probe <= knn_guard_ms (else stops for the night).
# 00:45 CT: after the evening traffic, done before the morning. Pause it and delete this file once the checkpoint has all
# 100 batches and the deletes have run (then the nightly's filter-field diff takes over, see the protocol doc).
resources:
  jobs:
    Vector_Refresh_Oxjob1433:
      name: "Semantic index filter-field refresh, paced nightly (oxjob #1433)"
      description: |
        Re-sends the 160.4M works whose semantic-search filter fields went stale (oxjob #1433) in small nightly batches,
        guarded by merge count and kNN latency on works-vectors-v2. Resumes from its checkpoint; safe to re-run.
      email_notifications:
        on_failure:
          - jason@ourresearch.org
        no_alert_for_skipped_runs: true
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 45 0 * * ?"   # 00:45 Central, quiet hours
        timezone_id: America/Chicago
        pause_status: UNPAUSED   # calibrated 1 Oct: ≈ 6 batches/h under the guard, semantic 5xx 0-6% per 5 min
      parameters:
        - name: max_batches
          default: "20"    # ≈ 32M docs; 62 batches left after 1 Oct → 4 nights (Fri 2 – Mon 5 Oct)
        - name: max_minutes
          default: "210"   # no batch starts after ≈ 04:15 CT
        - name: knn_guard_ms
          default: "600"
        - name: max_merges
          default: "4"
        - name: guard_wait_minutes
          default: "60"    # 5 Oct: after 1 batch the cache refill kept kNN at 550-850 ms for > 30 min (merges 0), stopping night 4 at 90/100
      tasks:
        - task_key: refresh
          notebook_task:
            notebook_path: notebooks/elastic/sync_vector_index_qwen3
            source: GIT
            base_parameters:
              is_full_sync: "false"
              staging_table: openalex.vector_search.oxjob1433_refresh_staging
              checkpoint_table: openalex.vector_search.oxjob1433_refresh_checkpoint
              num_batches: "100"
              resume: "true"
              deletes_table: openalex.vector_search.oxjob1433_refresh_deletes
              max_deletes: "5000000"
              mirror_table: none
              cleanup: "false"
              max_batches: "{{job.parameters.max_batches}}"
              max_minutes: "{{job.parameters.max_minutes}}"
              knn_guard_ms: "{{job.parameters.knn_guard_ms}}"
              max_merges: "{{job.parameters.max_merges}}"
              guard_wait_minutes: "{{job.parameters.guard_wait_minutes}}"
          job_cluster_key: refresh_cluster
          timeout_seconds: 21600
      job_clusters:
        - job_cluster_key: refresh_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            aws_attributes:
              first_on_demand: 1
              availability: ON_DEMAND
              zone_id: auto
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: rd-fleet.12xlarge
            driver_node_type_id: rd-fleet.8xlarge
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            spark_conf:
              spark.task.cpus: "4"   # 24 concurrent send tasks ≈ 11K docs/s; 8 workers at full speed made 1 in 4 semantic searches 504
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 2
            custom_tags:
              oxjob: "1433"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
