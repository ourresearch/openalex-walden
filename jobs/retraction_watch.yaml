resources:
  jobs:
    Retraction_Watch:
      name: Retraction Watch
      description: "Loads the Retraction Watch database (Crossref publishes it in full daily) into openalex.works.retraction_watch an hour before Walden End 2 End; CreateWorksBase flags a work retracted when Retraction Watch lists its DOI as a retracted paper. A failed run leaves the table as it was. oxjob #737."
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 4 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: load
          notebook_task:
            notebook_path: notebooks/ingest/RetractionWatch
            source: GIT
          environment_key: Default
          timeout_seconds: 1800
          max_retries: 2
          min_retry_interval_millis: 600000
      environments:
        - environment_key: Default
          spec:
            client: "3"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
