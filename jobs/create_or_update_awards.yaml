# Awards runs nightly against the production raw table.
resources:
  jobs:
    Create_Or_Update_Awards:
      name: Awards
      description: Refresh five explicit award sources with SQL MERGE; preserve unchanged and absent rows.
      tags: {stage: prod, lane: awards}
      schedule:
        quartz_cron_expression: "0 30 0 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - rohan@openalex.org
        no_alert_for_skipped_runs: true
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tasks:
        - task_key: create_or_update_awards
          notebook_task:
            notebook_path: notebooks/awards/CreateOrUpdateAwards
            source: GIT
            base_parameters:
              raw_table: openalex.awards.openalex_awards_raw
              stage: prod
          environment_key: Default
          timeout_seconds: 3000
          max_retries: 0
      environments:
        - environment_key: Default
          spec:
            client: "2"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
