resources:
  jobs:
    Repo_Reparse:
      name: Repo Reparse
      description: |
        oxjob #1828: re-read chosen endpoints' raw OAI files with today's Repo.py schema into
        openalex.repo.repo_reparse_items (Repo.py's third CDC flow into repo_works). Why: the notebook header.

        MANUAL TRIGGER ONLY, no schedule. Run mode=dry_run first (scratch tables + a diff against repo_works), size the
        works it re-stamps, file a rider for the night it rides, then mode=write. Endpoint ids are the folder names
        under s3://openalex-ingest/repositories/.
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      max_concurrent_runs: 1
      parameters:
        - name: endpoint_ids
          default: ""
        - name: mode
          default: "dry_run"
        - name: out_prefix
          default: "openalex.transient.repo_reparse"
        # oxjob #2266: repo_items instead of the raw files (a parse change that needs no new field), and an optional
        # table of native_ids that limits what is re-sent
        - name: source
          default: "s3"
        - name: native_ids_table
          default: ""
        # oxjob #883 / #1960: which copy of a (record, datestamp) to re-send. earliest = the copy repo_parsed kept (a
        # parse or schema change); latest = the newest delivery (a re-harvest or metadata_prefix switch that changed
        # records without moving their datestamps: KOPS, ORA)
        - name: copy
          default: "earliest"
      tasks:
        - task_key: repo_reparse
          # serverless's default environment failed to pip install the dlt_utils wheel (27 Oct); version 4 works
          environment_key: Default
          notebook_task:
            notebook_path: notebooks/ingest/RepoReparse
            source: GIT
            base_parameters:
              endpoint_ids: "{{job.parameters.endpoint_ids}}"
              mode: "{{job.parameters.mode}}"
              out_prefix: "{{job.parameters.out_prefix}}"
              source: "{{job.parameters.source}}"
              native_ids_table: "{{job.parameters.native_ids_table}}"
              copy: "{{job.parameters.copy}}"
          timeout_seconds: 7200
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: STANDARD
