resources:
  jobs:
    Authorship_Daily_Metrics:
      name: Authorship Daily Metrics
      description: |
        Observation-only daily monitor for the author-matching pipeline
        (oxjob #640, now the observer half of oxjob #1116 Monitoring). Diffs a
        per-work author-list fingerprint to detect list growth/shrinkage/name
        changes, tracks the null-author reservoir and stale seats, collects the
        end2end stage runtimes, and judges a nightly sample. Metrics go to the
        shared sink openalex.monitoring.metrics (component author_matching);
        the run-outcome metrics are written by MatchAuthors/UpdateWorkAuthors
        themselves. Writes ONLY monitor-owned tables (monitoring.metrics,
        work_author_list_fingerprint, work_author_change_events,
        authorship_monitor_candidates, authorship_daily_quality_sample) —
        never pipeline tables.
        First run bootstraps the fingerprint for every work (one-time, hours);
        daily runs are incremental over the day's touched works.
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      schedule:
        # 22:30 UTC — after end2end (05:00 UTC start, usually done by ~17:30)
        # and offset from Works Daily Metrics (22:00) so both aren't spinning
        # clusters at once. Must run BEFORE the next end2end (05:00) replaces
        # the ephemeral run-state tables this job snapshots. Metrics writes
        # are idempotent per snapshot_date; change events are append-only.
        quartz_cron_expression: 0 30 22 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      parameters:
        - name: snapshot_date
          default: "{{job.start_time.iso_date}}"
      tasks:
        - task_key: authorship_daily_metrics
          notebook_task:
            notebook_path: notebooks/metrics/AuthorshipDailyMetrics
            source: GIT
          job_cluster_key: metrics-cluster
        - task_key: authorship_quality_judge
          depends_on:
            - task_key: authorship_daily_metrics
          notebook_task:
            notebook_path: notebooks/metrics/AuthorshipQualityJudge
            source: GIT
          job_cluster_key: metrics-cluster
        # ai_query runs on a WAREHOUSE: cluster-side ai_query (DBR 16.4) sends
        # a temperature param the opus-4-8 reasoning endpoint rejects.
        - task_key: authorship_quality_judge_apply
          depends_on:
            - task_key: authorship_quality_judge
          notebook_task:
            notebook_path: notebooks/metrics/AuthorshipQualityJudgeApply
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
        # Jev quality sample (oxjob #1301): five pipeline strata judged by Jev
        # with a capped Opus 5 tail; metrics to openalex.monitoring.metrics
        # (component jev_quality) for the 23:30 UTC Monitoring job. Runs here
        # because its authorship stratum reads the same ephemeral
        # pending_author_assignments the judge does. Runs alongside the apply
        # task (~15-20 min; Jev 31K calls at 16 threads). Never touches
        # pipeline tables. Secrets: scope typesafe / api_key; the Opus tail
        # calls the FMAPI endpoint with the job's own token.
        - task_key: jev_quality_sample
          depends_on:
            - task_key: authorship_quality_judge
          notebook_task:
            notebook_path: notebooks/metrics/JevQualitySample
            source: GIT
          job_cluster_key: metrics-cluster
      job_clusters:
        - job_cluster_key: metrics-cluster
          new_cluster:
            # Daily run: incremental candidate set (0.1-1M works typical) plus
            # column-pruned scans of work_authors for daily-activity counters.
            # First run bootstraps the fingerprint: full work_authors group-by
            # (~3B rows) + hash of every base author list (~510M works) — the
            # NVMe on m5d.2xlarge absorbs the shuffle spill; expect hours once.
            spark_version: 16.4.x-scala2.12
            node_type_id: m5d.2xlarge
            num_workers: 4
            runtime_engine: PHOTON
            aws_attributes:
              availability: ON_DEMAND
              zone_id: auto
              ebs_volume_type: GENERAL_PURPOSE_SSD
              ebs_volume_count: 1
              ebs_volume_size: 64
            data_security_mode: SINGLE_USER
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: STANDARD
