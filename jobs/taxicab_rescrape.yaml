resources:
  jobs:
    TaxiCabRescrape:
      name: TaxiCab Rescrape
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      # oxjob #1646 (22 Nov 2026): 5 -> 7 so the xpac full run's PDF batches run beside its page campaigns
      # and other jobs' campaigns still find a slot; each run is its own single-node cluster. Revert: back to 5.
      # oxjob #1646 (23 Nov 2026): 7 -> 8, and queueing on. With all slots full Databricks skipped a campaign
      # wave's run; TaxiCab Campaign scored it as a wave that fetched nothing, and a second skip marks those
      # URLs skipped for good. Queued, the run waits for a slot (the guard reads QUEUED as fetching).
      # Revert: 7 and enabled: false.
      # oxjob #1646 (23 Nov 2026, 10:30 CT): 8 -> 10. #2381's paced FCCN campaigns hold up to 2 slots for days
      # (site_per_hour waves run for hours); 10 keeps room for the xpac run's PDF campaigns and everyone else's.
      # Revert: 8.
      max_concurrent_runs: 10
      queue:
        enabled: true
      tasks:
        - task_key: run_taxicab_rescrape
          notebook_task:
            notebook_path: notebooks/scraping/taxicab
            source: GIT
            base_parameters:
              lookback_days: "3"
              url_limit: "1000000"
              rescrape_queue_only: "true"
              harvest_workers: "600"
              queue_table: "openalex.taxicab.rescrape_queue"
              max_per_host: "10"
              doi_host_key: "host"
              # oxjob #1790: TaxiCab Campaign sets a campaign's own Zyte API key name
              zyte_key: ""
              # oxjob #2381: per-site pace, fetch starts per site per hour (0 = off); a campaign sets it in its settings
              site_per_hour: "0"
          job_cluster_key: Taxicab_Rescrape_job_cluster
      job_clusters:
        - job_cluster_key: Taxicab_Rescrape_job_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: us-east-1f
              spot_bid_price_percent: 100
            node_type_id: m5d.4xlarge
            driver_node_type_id: m5d.4xlarge
            custom_tags:
              ResourceClass: SingleNode
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      parameters:
        - name: lookback_days
          default: "3"
        - name: url_limit
          default: "1000000"
        - name: rescrape_queue_only
          default: "true"
        - name: harvest_workers
          default: "600"
        - name: queue_table
          default: "openalex.taxicab.rescrape_queue"
        - name: max_per_host
          default: "10"
        - name: doi_host_key
          default: "host"
        - name: zyte_key
          default: ""
        - name: site_per_hour
          default: "0"
