resources:
  jobs:
    Nightly_Grants:
      name: Nightly Grants
      # Replaces the RefreshAwards stable-id release chain (09-30). One task: build ids + awards + paper links + API,
      # check everything, swap, publish changed award docs to search. Code: notebooks/awards/nightly_grants/.
      # Runs before Walden_End_2_End (05:00 UTC), which reads openalex.awards.work_awards.
      # PAUSED here until the first attended run is verified; unpause by changing this line (a bundle deploy applies it).
      email_notifications:
        on_failure:
          - rohan@openalex.org
        no_alert_for_skipped_runs: true
      schedule:
        quartz_cron_expression: 0 0 3 * * ?
        timezone_id: UTC
        pause_status: PAUSED
      max_concurrent_runs: 1
      timeout_seconds: 21600
      queue:
        enabled: true
      tasks:
        - task_key: nightly_grants
          environment_key: nightly_grants
          notebook_task:
            notebook_path: notebooks/awards/nightly_grants/NightlyGrants
            source: GIT
            base_parameters:
              databricks_run_id: "{{job.run_id}}"
              overrides_json: ""
      environments:
        - environment_key: nightly_grants
          spec:
            client: "1"
            dependencies:
              - elasticsearch==8.19.0
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
