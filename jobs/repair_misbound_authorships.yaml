resources:
  jobs:
    Repair_Misbound_Authorships:
      name: Repair Misbound Authorships
      description: |
        oxjob #608 0-REPAIR: one-time, waved batch repair of positionally-misbound
        author bindings. MANUAL TRIGGER ONLY — no schedule. One run = one batch cycle
        of the RepairMisboundAuthorships notebook: resolve (live recompute) -> gate
        (Haiku volume judge + Opus anchor) -> gated apply -> verify. Apply requires
        repair_apply='true' AND a passing gate AND the end2end quiet window (caller
        checks — never trigger an apply run while walden_end2end is running).
        Detector snapshot cells are CREATE TABLE IF NOT EXISTS (no-ops after first build).
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      max_concurrent_runs: 1
      parameters:
        - name: repair_wave
          default: "wave0_corpus"
        - name: repair_apply
          default: "false"
        - name: apply_nulls
          default: "false"
        - name: batch_max_works
          default: "50000"
      tasks:
        - task_key: repair_batch_cycle
          notebook_task:
            notebook_path: notebooks/authors/RepairMisboundAuthorships
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
            base_parameters:
              repair_wave: "{{job.parameters.repair_wave}}"
              repair_apply: "{{job.parameters.repair_apply}}"
              apply_nulls: "{{job.parameters.apply_nulls}}"
              batch_max_works: "{{job.parameters.batch_max_works}}"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: STANDARD
