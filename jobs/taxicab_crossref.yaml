resources:
  jobs:
    TaxiCab_Crossref:
      name: TaxiCab Crossref
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      schedule:
        quartz_cron_expression: 41 0 2/4 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      queue:
        enabled: false
      tasks:
        - task_key: run_taxicab
          notebook_task:
            notebook_path: notebooks/scraping/taxicab
            source: GIT
            base_parameters:
              # oxjob #1997 (as #1538 did for Repos): the hold-backs (host breaker probes, 3,000 a
              # run per DOI prefix, 200-min deadline) assume leftovers wait in the window for the
              # next run. A 3-day window let them age out unfetched: 3 Nov, 19,244 new DOIs never
              # fetched (13,728 one 17 Oct deposit of 10.70413, 2,247 De Gruyter 10.1515).
              lookback_days: "30"
              url_limit: "500000"
              source_filter: "crossref_only"
          job_cluster_key: Taxicab_job_cluster
      job_clusters:
        - job_cluster_key: Taxicab_job_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: us-east-1f
              spot_bid_price_percent: 100
            node_type_id: m5d.4xlarge
            driver_node_type_id: m5d.4xlarge
            custom_tags:
              ResourceClass: SingleNode
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      parameters:
        - name: lookback_days
          default: "30"
        - name: url_limit
          default: "500000"
        - name: source_filter
          default: "crossref_only"
