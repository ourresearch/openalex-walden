# Funders registry: SQL cells, ROR-only creation, existing fields/DOIs preserved.
# Development prefix and PAUSED schedule until a separately approved cutover.
# Production daily publishes compat only; existing 04:00 CreateFundersAPI job owns API/ES.
resources:
  jobs:
    Create_Or_Update_Funders:
      name: Funders
      description: Dev funder registry; paused pending production cutover.
      tags: {stage: dev, lane: funders}
      schedule:
        quartz_cron_expression: "0 45 21 * * ?"
        timezone_id: UTC
        pause_status: PAUSED   # deployed paused; unpause by changing this line in a later push (a UI unpause is reset by the next bundle deploy)
      email_notifications:
        on_failure:
          - rohan@openalex.org
        no_alert_for_skipped_runs: true
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tasks:
        - task_key: fetch_resolve_publish
          notebook_task:
            notebook_path: notebooks/funders/CreateOrUpdateFunders
            source: GIT
            base_parameters:
              prefix: openalex_dev.rohan_lab.ff1013_registry_
              allow_prod: ""
              seed_source: openalex_dev.rohan_lab.ff1013_registry_seed
              seed_version: "0"
              mode: daily
              run_id: "{{job.run_id}}"
              max_mints: "200"   # fuse: more mints in one night stops the run for a person; nothing is applied
          environment_key: Default
          timeout_seconds: 3000
          max_retries: 1
          min_retry_interval_millis: 600000
      environments:
        - environment_key: Default
          spec:
            client: "2"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
