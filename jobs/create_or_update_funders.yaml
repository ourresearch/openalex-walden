# Funders registry: SQL cells, ROR-only creation, existing fields/DOIs preserved.
# Production daily registry after accepted cutover; activation is shipped in YAML.
# Production daily publishes compat and re-signs the name lookup for it; existing 04:00 CreateFundersAPI job owns API/ES.
# Daily loop only (no mode parameter); the one-time registry seed is notebooks/funders/SeedFunders, run by hand, no job.
resources:
  jobs:
    Create_Or_Update_Funders:
      name: Funders
      description: Production funder registry; existing fields and DOIs preserved.
      tags: {stage: prod, lane: funders}
      schedule:
        quartz_cron_expression: "0 45 21 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED   # accepted forward state; YAML owns activation across later deploys
      email_notifications:
        on_failure:
          - rohan@openalex.org
        no_alert_for_skipped_runs: true
      max_concurrent_runs: 1
      timeout_seconds: 7200   # >= task 3000 + retry interval 600 + retried task 3000, so the one retry can actually run
      tasks:
        - task_key: fetch_resolve_publish
          notebook_task:
            notebook_path: notebooks/funders/CreateOrUpdateFunders
            source: GIT
            base_parameters:
              prefix: openalex.funders.
              allow_prod: "openalex.funders."
              run_id: "{{job.run_id}}"
              max_mints: "280"   # fuse: more mints in one night stops the run for a person; nothing is applied. First run: 234-235 measured + 45 margin (MAXMINTS-EVIDENCE 10-14); set back to "200" after the first clean night
          environment_key: Default
          timeout_seconds: 3000
          max_retries: 1
          min_retry_interval_millis: 600000
      environments:
        - environment_key: Default
          spec:
            client: "2"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
