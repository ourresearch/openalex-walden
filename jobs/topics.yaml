resources:
  jobs:
    Topics:
      name: Topics
      description: |
        Topics for new works (oxjob #1531), run by Walden End 2 End (task Topics, after Works_Base, before Author_Matching).
        Three tasks: topics_create_input (queue = works in openalex_works_base with a title or abstract and no row in
        openalex.works.work_topics_v2, newest first, at most max_works), topics_score_modal (the queue on Modal, app
        openalex-topics-nightly: the #1485 student q8b_2m, vLLM FP8, at most 8 H100s, via a bearer-token endpoint; raw top-10
        scores into the append-only ledger work_topics_v2_raw), topics_merge_v2 (checks, then INSERT of new work_ids only into
        work_topics_v2; a failed check appends nothing; catalogue records from catalogue_sources_table with type dataset / other
        get topics = [] and catalogue_record = true). CreateWorksEnriched merges work_topics_v2 into openalex_works the same
        night. About 110K works a night, under $1 of Modal GPU. State tables: openalex.works.work_topics_v2_{queue, raw,
        append_rows, runs}. Rollback: the previous version of this file (topic-classifier serving endpoint + topics_merge_output
        into work_topics); those notebooks are still in notebooks/topics/.
      email_notifications:
        on_failure:
          - artem@ourresearch.org
          - casey@ourresearch.org
          - jason@ourresearch.org
        no_alert_for_skipped_runs: true
      timeout_seconds: 21600
      parameters:
        - name: state_prefix
          default: openalex.works.work_topics_v2_
        - name: target
          default: openalex.works.work_topics_v2
        - name: works_table
          default: openalex.works.openalex_works_base
        - name: max_works
          # newest first beyond this; the rest waits for the next run (a bulk arrival of millions: raise it by hand, and max_usd)
          default: "3000000"
        - name: shard_works
          # works per Modal shard (one H100 call each, at most 8 containers at once)
          default: "25000"
        - name: force_ids_table
          # tests / backfills only: queue exactly the not-yet-served works in this table (column id)
          default: ""
        - name: reuse_hours
          # a job retry reuses an unfinished queue younger than this (same build id, same Modal call)
          default: "20"
        - name: volume_dir
          default: /Volumes/openalex/works/data/topics_nightly
        - name: endpoint
          default: https://wordslikethis--openalex-topics-nightly-api.modal.run
        - name: secret_scope
          default: modal
        - name: secret_key
          default: topics1531_nightly_token
        - name: warehouse_id
          # the warehouse the Modal app exports the queue through (DEV-WH, X-Large serverless)
          default: 3996dc0a9b183ce3
        - name: max_usd
          # topics_score_modal refuses to start a queue whose estimate is over this
          default: "30"
        - name: max_minutes
          default: "150"
        - name: catalogue_sources_table
          # catalogue records (source in this table AND type dataset / other) are served with topics = [] and catalogue_record = true;
          # the ledger keeps their raw scores. Empty string disables the rule.
          default: openalex.works.work_topics_v2_catalogue_sources
        - name: max_nc_share
          # topics_merge_v2 refuses a build whose not-classifiable share is over this (corpus: 0.096)
          default: "0.30"
        - name: dry_run
          default: "false"
      tasks:
        - task_key: topics_create_input
          notebook_task:
            notebook_path: notebooks/topics/nightly/BuildTopicQueue
            source: GIT
          environment_key: Default
        - task_key: topics_score_modal
          depends_on:
            - task_key: topics_create_input
          notebook_task:
            notebook_path: notebooks/topics/nightly/TagTopicsModal
            source: GIT
          environment_key: Default
          # A retry polls the same Modal call (its id is in <volume_dir>/<build_id>/_call_id.txt), never starts a second GPU run.
          max_retries: 2
          min_retry_interval_millis: 300000
        - task_key: topics_merge_v2
          depends_on:
            - task_key: topics_score_modal
          notebook_task:
            notebook_path: notebooks/topics/nightly/MergeTopicsV2
            source: GIT
          environment_key: Default
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
