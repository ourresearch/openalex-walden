resources:
  jobs:
    Sync_Authors_to_Elasticsearch:
      name: Sync Authors to Elasticsearch
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      schedule:
        quartz_cron_expression: 35 0 5 * * ?
        timezone_id: America/Chicago
        # oxjob #1531: authors-v20 (rebuilt with the new topics) is live since 2026-10-06 11:23 CT; authors-v19 kept 48 h for rollback.
        # Stays PAUSED through the Wed 7 Oct 05:35 run: sync_authors looks back 2 days by updated_date, so that run would re-push
        # Monday's 101.7M re-stamped profiles (already in the full load). Unpause from Wed ~06:00 CT (wake 1531 sets it).
        pause_status: PAUSED
      tasks:
        - task_key: sync_authors
          job_cluster_key: sync_authors_cluster
          notebook_task:
            notebook_path: notebooks/elastic/sync_authors
            source: GIT
            base_parameters:
              is_full_sync: "false"
              index_name: authors-v20
        - task_key: delete_authors
          depends_on:
            - task_key: sync_authors
          job_cluster_key: sync_authors_cluster
          notebook_task:
            notebook_path: notebooks/elastic/delete_authors
            source: GIT
            base_parameters:
              guard_fraction: "0.02"
              index_name: authors-v20
              deleted_authors_guard_override: "false"
          max_retries: 2
          min_retry_interval_millis: 300000
      job_clusters:
        - job_cluster_key: sync_authors_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            aws_attributes:
              availability: ON_DEMAND
            node_type_id: rd-fleet.8xlarge
            driver_node_type_id: rd-fleet.4xlarge
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            data_security_mode: DATA_SECURITY_MODE_DEDICATED
            runtime_engine: STANDARD
            kind: CLASSIC_PREVIEW
            is_single_node: false
            num_workers: 1
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
