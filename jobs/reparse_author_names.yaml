resources:
  jobs:
    Reparse_Author_Names:
      name: Reparse Author Names
      description: |
        oxjob #105.17: full re-parse of openalex.authors.author_names after a
        parser version bump in CreateAuthorNames (v2.4 = #608 Classes 1-3:
        surname-first initials formats + CJK comma/both-token routing).
        MANUAL TRIGGER ONLY — no schedule. Runs CreateAuthorNames with
        full_reparse=true: re-parses every known raw name and MERGEs only rows
        whose parse changed (created_datetime preserved; Delta operationMetrics
        report the changed-row count). Do not run while walden_end2end is
        running — MatchAuthors and the authorship guard read these keys live.
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      max_concurrent_runs: 1
      parameters:
        # env_suffix must exist as a job parameter: the notebook's %sql DDL cell
        # binds :env_suffix before the widget-declaring python cell runs.
        - name: env_suffix
          default: ""
        - name: full_reparse
          default: "true"
      tasks:
        - task_key: full_reparse
          notebook_task:
            notebook_path: notebooks/end2end/CreateAuthorNames
            source: GIT
            base_parameters:
              env_suffix: "{{job.parameters.env_suffix}}"
              full_reparse: "{{job.parameters.full_reparse}}"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: STANDARD
