# Not in databricks.yml: created with `databricks jobs create` from this file on 2026-11-19 (job 238160099901782, oxjob #2450)
# while the bundle is out of sync with the workspace. Whoever reconciles the bundle: include this file and bind
# that job instead of creating a second one.
resources:
  jobs:
    Fulltext_Contributor_Roles:
      name: Fulltext Contributor Roles
      description: CRediT roles read from full-text contribution statements into openalex.works.fulltext_contributor_roles (oxjob #2450); see notebooks/ingest/FulltextContributorRoles.
      schedule:
        # before the 03:00 UTC End 2 End, which reads the table in CreateWorksEnriched; picks up the full text the
        # previous night's CreateWorkFulltext added
        quartz_cron_expression: 0 0 1 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: Read_Fulltext_Contributor_Roles
          job_cluster_key: roles_cluster
          notebook_task:
            notebook_path: notebooks/ingest/FulltextContributorRoles
            source: GIT
            base_parameters:
              mode: daily
          max_retries: 1
          min_retry_interval_millis: 600000
          timeout_seconds: 7200
      job_clusters:
        - job_cluster_key: roles_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: us-east-1f
              spot_bid_price_percent: 100
            node_type_id: m5d.2xlarge
            driver_node_type_id: m5d.2xlarge
            num_workers: 4
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            custom_tags:
              oxjob: "2450"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
