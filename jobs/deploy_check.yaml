# Temporary (oxjob #1973): proves the CI deploy account can create and delete a job with its own cluster without
# being a workspace admin. No schedule and a notebook path that doesn't exist, so it never runs. Removed next commit.
resources:
  jobs:
    Deploy_Check:
      name: Deploy Check (temporary)
      max_concurrent_runs: 1
      tasks:
        - task_key: Check_Deploy
          job_cluster_key: check_cluster
          notebook_task:
            notebook_path: notebooks/deploy_check_does_not_exist
            source: GIT
      job_clusters:
        - job_cluster_key: check_cluster
          new_cluster:
            spark_version: 16.4.x-scala2.13
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            node_type_id: m5d.large
            custom_tags:
              ResourceClass: SingleNode
            num_workers: 0
            data_security_mode: SINGLE_USER
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
