resources:
  jobs:
    Funder_Reported_Work_Funders:
      name: Funder Reported Work Funders
      description: |
        Three tasks, daily. create_funder_reported_links: funders' own output lists (NWO, FWF, ANR,
        Hakai, KAKEN) -> openalex.awards.funder_reported_links, a Nightly Grants leg that follows each
        source, deletions included. create_pubmed_work_funders (oxjob #2544): PubMed's own GrantList ->
        openalex.awards.pubmed_work_funders (a Nightly Grants leg) and its award shells.
        create_funder_reported_work_funders (oxjob #739, Casey-approved 2026-08-10): the additive union
        openalex.awards.funder_reported_work_funders that CreateWorksEnriched reads for work.funders, from
        Europe PMC, DataCite, kaken_work_funders, PubMed and the ANR and Hakai links (MERGE ... WHEN NOT
        MATCHED THEN INSERT; never drops a previously served pair).
      schedule:
        # 23:30 UTC — after DataCite_Work_Funders (23:00 UTC, the union's one input with its own nightly
        # job; it commits in ~45 s, measured 2026-08-24), before Nightly Grants (00:00 UTC, which reads the
        # links) and Walden_End_2_End (03:00 UTC, which runs CreateWorksEnriched and needs the union fresh).
        quartz_cron_expression: 0 30 23 * * ?
        timezone_id: UTC
        # UNPAUSED 2026-08-31 (owner's go): attended first runs landed 08-28 (both
        # SUCCESS; +3,261,084 inserted, second run 0-row idempotent) and three
        # downstream E2E cycles (08-29/30/31 05:00Z) consumed the union clean.
        # Audit + verification: grants-work/routing-audit-20260831 (local).
        pause_status: UNPAUSED
      tasks:
        # PubMed's own GrantList -> openalex.awards.pubmed_work_funders (a Nightly Grants leg, also in the union below) and
        # its award shells in openalex_awards_raw (oxjob #2544). Scope: records published before before_year, US Public
        # Health Service agencies. A night with no PubMed change writes nothing (MERGE leaves unchanged rows alone).
        - task_key: create_pubmed_work_funders
          notebook_task:
            notebook_path: notebooks/awards/CreatePubmedWorkFunders
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
            base_parameters:
              leg_table: openalex.awards.pubmed_work_funders
              raw_table: openalex.awards.openalex_awards_raw
              before_year: "2000"
              first_fill_max: "1500000"
          timeout_seconds: 3600
          # openalex_awards_raw has other writers; a concurrent commit conflict is retried once
          max_retries: 1
          min_retry_interval_millis: 120000
        # Every funder's own output list -> openalex.awards.funder_reported_links, one row per (source, work, funder).
        - task_key: create_funder_reported_links
          notebook_task:
            notebook_path: notebooks/awards/CreateFunderReportedLinks
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
          timeout_seconds: 3600
          email_notifications:
            on_failure:
              - rohan@openalex.org
        # Reads the links the task above wrote, and PubMed's leg (create_pubmed_work_funders re-resolves funders merged
        # since its last run; the union's GATE 2 refuses merge losers). ALL_DONE: if either fails, its table is as it was
        # and the union still adds the other sources' pairs.
        - task_key: create_funder_reported_work_funders
          depends_on:
            - task_key: create_pubmed_work_funders
            - task_key: create_funder_reported_links
          run_if: ALL_DONE
          notebook_task:
            notebook_path: notebooks/awards/CreateFunderReportedWorkFunders
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
