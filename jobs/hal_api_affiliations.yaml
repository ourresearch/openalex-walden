resources:
  jobs:
    HalApiAffiliations:
      name: HAL API Affiliations
      description: "HAL affiliations from HAL's search API into landing_page_works_backfill for HAL records whose work has no affiliation strings (HAL blocks scrapers with Anubis since spring 2026). oxjob #1402."
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 20 ? * SUN"
        timezone_id: America/Chicago
        pause_status: UNPAUSED
      tasks:
        - task_key: hal_api_affiliations
          notebook_task:
            notebook_path: notebooks/ingest/HalApiAffiliations
            source: GIT
          job_cluster_key: hal_api_job_cluster
      job_clusters:
        - job_cluster_key: hal_api_job_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: us-east-1f
              spot_bid_price_percent: 100
            node_type_id: r5d.2xlarge
            driver_node_type_id: r5d.2xlarge
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: PHOTON
            num_workers: 4
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      parameters:
        - name: max_ids
          default: "300000"
        - name: refetch_days
          default: "30"
        - name: dry_run
          default: "false"
