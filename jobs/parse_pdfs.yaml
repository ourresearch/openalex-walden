resources:
  jobs:
    Parse_PDFs:
      name: Parse PDFs
      # 2 slots: the 8-hourly normal-mode run and one #789 batch drain run
      # alongside. Safe: normal mode never reads grobid_reparse_queue, and the
      # campaign's pre-0.9.1 pdfs cannot appear in the 3-day normal window.
      # Batch drains themselves stay serialized by the campaign runner.
      max_concurrent_runs: 2
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 8
          unit: HOURS
      tasks:
        - task_key: parse_pdfs
          notebook_task:
            notebook_path: notebooks/parsing/parse_pdfs
            source: GIT
          job_cluster_key: parse_pdfs_cluster
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      job_clusters:
        - job_cluster_key: parse_pdfs_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: us-east-1f
              spot_bid_price_percent: 100
            node_type_id: rd-fleet.8xlarge
            driver_node_type_id: rd-fleet.8xlarge
            custom_tags:
              ResourceClass: SingleNode
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0