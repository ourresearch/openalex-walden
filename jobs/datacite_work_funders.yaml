resources:
  jobs:
    DataCite_Work_Funders:
      name: DataCite Work Funders
      schedule:
        # Before Nightly Grants (03:00 UTC), which reads our table the same night; this job reads the award map of
        # the night before's Nightly Grants run. Crossref Work Funders also runs at 02:00; NWO/Hakai are on-demand.
        quartz_cron_expression: 0 0 2 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: create_datacite_work_funders
          notebook_task:
            notebook_path: notebooks/awards/CreateDataCiteWorkFunders
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
