resources:
  jobs:
    Sync_Institutions_to_Elasticsearch:
      name: Sync Institutions to Elasticsearch
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS
      tasks:
        - task_key: create_institutions_api
          notebook_task:
            notebook_path: notebooks/institutions/CreateInstitutionsApi
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
          timeout_seconds: 3600
          # The institutions_api rebuild is one statement at the DEV-WH heap ceiling
          # ("Java heap space" on 5 of 11 days to 2026-09-12, no concurrent load);
          # retries carry it until the works scan is split out into its own table.
          max_retries: 2
          min_retry_interval_millis: 600000
        - task_key: sync_institutions_to_elasticsearch
          depends_on:
            - task_key: create_institutions_api
          notebook_task:
            notebook_path: notebooks/elastic/sync_institutions
            source: GIT
          timeout_seconds: 1800
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: STANDARD
