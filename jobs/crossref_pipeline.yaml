# Crossref DLT pipeline (7def27a3-968c-4b1a-864b-0fc308756721).
# Bundle-managed: notebook code deploys via CI on push to main — do NOT pull the
# /Shared/openalex-walden Git folder for this pipeline; edits made in the pipeline UI
# (settings AND code) are reverted on the next deploy.
resources:
  pipelines:
    crossref_pipeline:
      name: Crossref
      # Pin the owner to the CI deploy service principal (github-actions-deploy).
      # Without this the CLI makes whoever runs `bundle deploy` the owner, and only
      # metastore admins can change a pipeline owner, so a local deploy breaks CI.
      permissions:
        - service_principal_name: 321056ec-06df-41ad-8227-2c238f818596
          level: IS_OWNER
      catalog: openalex
      target: crossref
      # REFRESH PROFILE (oxjob #1099, 2026-10-07) -- TEMPORARY. Revert to
      # `serverless: true` / `photon: true` / `development: true` / arrow 100 and UNPAUSE
      # jobs/crossref.yaml once the selective refresh of crossref_parsed + crossref_works
      # lands. 40 workers as #880; photon OFF for the Pandas-UDF stages (#314); arrow 50 and
      # development false so DLT retries a crashed flow (#1118).
      serverless: false
      photon: false
      clusters:
        - label: default
          node_type_id: r5d.8xlarge
          driver_node_type_id: r5d.8xlarge
          num_workers: 40
      continuous: false
      development: false  # TEMPORARY (oxjob #1099 refresh): retries on flow failure
      channel: CURRENT
      configuration:
        environment: prod
        pipelines.clusterShutdown.delay: 300s
        spark.sql.execution.arrow.maxRecordsPerBatch: "50"  # TEMPORARY (oxjob #1099 refresh); serverless steady state is 100
      tags:
        environment: prod
        workflow: crossref
      libraries:
        - notebook:
            path: ../notebooks/ingest/Crossref.py
