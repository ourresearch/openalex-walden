# Crossref DLT pipeline (7def27a3-968c-4b1a-864b-0fc308756721).
# Bundle-managed: notebook code deploys via CI on push to main — do NOT pull the
# /Shared/openalex-walden Git folder for this pipeline; edits made in the pipeline UI
# (settings AND code) are reverted on the next deploy.
resources:
  pipelines:
    crossref_pipeline:
      name: Crossref
      # Pin the owner to the CI deploy service principal (github-actions-deploy).
      # Without this the CLI makes whoever runs `bundle deploy` the owner, and only
      # metastore admins can change a pipeline owner, so a local deploy breaks CI.
      permissions:
        - service_principal_name: 321056ec-06df-41ad-8227-2c238f818596
          level: IS_OWNER
      catalog: openalex
      target: crossref
      # REFRESH PROFILE (oxjob #2187, 2026-11-12) -- TEMPORARY, as #1099's (f94e9ddc + bc74ac97). Revert this commit
      # (serverless, photon, development true, arrow 100; crossref.yaml and union_all_works.yaml UNPAUSED) once the
      # selective refresh of crossref_parsed + crossref_works lands.
      serverless: false
      photon: false
      clusters:
        - label: default
          node_type_id: r5d.8xlarge
          driver_node_type_id: r5d.8xlarge
          num_workers: 40
          spark_conf:
            spark.task.cpus: "2"
      continuous: false
      development: false
      channel: CURRENT
      configuration:
        environment: prod
        pipelines.clusterShutdown.delay: 300s
        spark.sql.execution.arrow.maxRecordsPerBatch: "50"
      tags:
        environment: prod
        workflow: crossref
      libraries:
        - notebook:
            path: ../notebooks/ingest/Crossref.py
