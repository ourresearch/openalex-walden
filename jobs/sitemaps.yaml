# Sitemaps + IndexNow for openalex.org record pages (oxjob #1689).
# In databricks.yml `include:` since 2026-10-15 (Jason's yes). Jason, 2026-10-17: the sitemaps are the same plain URL
# lists for everyone and say nothing about what changed: no lastmod, no changed group, no IndexNow to anyone. So the
# job stays PAUSED: a nightly build would add new records every night, which is itself a list of what changed. A
# refresh cadence (the idea: every 90 days, with the quarterly snapshot) is still to be decided; until then run it by
# hand only. History: oxjobs #1689 (working/search-engines-see-record-pages), work/build-sitemaps.md and PLAN.md.
resources:
  jobs:
    Sitemaps:
      name: Sitemaps (openalex.org)
      description: |
        Nightly sitemaps for openalex.org record pages: every record above the quality bar (utils/sitemaps.py,
        the same rule as the website's noindex, openalex-gui src/seo/indexable.mjs), grouped by entity and
        quality group, lastmod = when the page's content last changed (page fingerprints in
        openalex.sitemaps.page_state), plus a rolling "changed" group. Files go to R2 bucket openalex-sitemaps
        (live/ prefix), served at https://openalex.org/sitemap.xml by the website. Then IndexNow pings for the
        night's new, updated and removed record URLs. Since 2026-10-17: no lastmod, no changed group, no IndexNow
        (change_signals=false); source=state re-publishes the published record set as is. Writes only
        openalex.sitemaps.* and the R2 bucket.
      email_notifications:
        on_failure:
          - jason@ourresearch.org
        no_alert_for_skipped_runs: true
      schedule:
        # 20:00 UTC: after Walden End 2 End's publish path (05:00 UTC start; ES sync done by ~17:30 on most
        # days). The notebook refuses to run if today's works ES sync hasn't started.
        quartz_cron_expression: 0 0 20 * * ?
        timezone_id: UTC
        pause_status: PAUSED   # Jason 2026-10-17: no nightly builds (see the top of this file)
      max_concurrent_runs: 1
      parameters:
        - name: mode
          default: "publish"          # "dry_run" builds to dryrun/<run> and touches nothing live
        - name: change_signals
          default: "false"            # Jason 2026-10-17: never "true" without his say-so
        - name: source
          default: "current"          # "state" = re-publish the published record set as is
        - name: changed_days
          default: "7"
        - name: changed_max_urls
          default: "1000000"
      tasks:
        - task_key: build_sitemaps
          job_cluster_key: sitemaps_cluster
          notebook_task:
            notebook_path: notebooks/sitemaps/BuildSitemaps
            source: GIT
            base_parameters:
              mode: "{{job.parameters.mode}}"
              changed_days: "{{job.parameters.changed_days}}"
              changed_max_urls: "{{job.parameters.changed_max_urls}}"
              change_signals: "{{job.parameters.change_signals}}"
              source: "{{job.parameters.source}}"
          timeout_seconds: 7200
          max_retries: 1
          min_retry_interval_millis: 600000
      job_clusters:
        - job_cluster_key: sitemaps_cluster
          new_cluster:
            spark_version: 16.4.x-scala2.12
            # Works fingerprints read ~208 GB of columns (measured 2026-10-15: 37 task-minutes on a SQL
            # warehouse); 8 x 8 cores keep the whole run near 20 min. m5d NVMe for the shuffle.
            node_type_id: m5d.2xlarge
            num_workers: 8
            runtime_engine: PHOTON
            aws_attributes:
              availability: SPOT_WITH_FALLBACK
              first_on_demand: 1
              zone_id: auto
            data_security_mode: SINGLE_USER
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
