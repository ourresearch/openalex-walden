# HAL xml-tei DLT pipeline (oxjob #1588): s3://openalex-ingest/hal-tei/ -> openalex.repo.hal_tei_*.
# Bundle-managed: notebook code deploys via CI on push to main — do NOT pull the
# /Shared/openalex-walden Git folder for this pipeline; edits made in the pipeline UI
# (settings AND code) are reverted on the next deploy.
#
# NOTE: this pipeline publishes via `schema:` (default publishing mode), not `target:` —
# keep it that way; switching modes forces a table migration.
resources:
  pipelines:
    hal_tei_pipeline:
      name: HAL TEI
      # Pin the owner to the CI deploy service principal (github-actions-deploy).
      # Without this the CLI makes whoever runs `bundle deploy` the owner, and only
      # metastore admins can change a pipeline owner, so a local deploy breaks CI.
      permissions:
        - service_principal_name: 321056ec-06df-41ad-8227-2c238f818596
          level: IS_OWNER
      catalog: openalex
      schema: repo
      serverless: true
      photon: true
      continuous: false
      development: true
      channel: CURRENT
      configuration:
        # One row = one harvested file: hand the parser UDF ONE file per Python batch. Batches of 100-1,000
        # files OOMed the Python workers (9 Oct); 4 files did too on 10 Oct, once files of big-collaboration
        # papers arrived (a 1,000-record file with 94,661 authors, 52 MB of XML, parses to ~250 MB with its
        # pickled copy). The harvester now caps hal_tei files at 32 MB of XML (openalex-ingest 87bc8de).
        spark.sql.execution.arrow.maxRecordsPerBatch: "1"
        spark.sql.execution.python.udf.maxRecordsPerBatch: "1"
      libraries:
        - notebook:
            path: ../notebooks/ingest/HalTei.py
