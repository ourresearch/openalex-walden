resources:
  jobs:
    Sync_Vector_Index_Qwen3:
      name: Sync Vector Index to Elasticsearch (Qwen3, oxjob #1275)
      description: |
        Builds works-vectors-v2 from openalex.vector_search.work_embeddings_qwen3
        (473.6M multilingual Qwen3-Embedding-0.6B vectors). Manual trigger only — no schedule.

        PREREQ: the openalex-vector-search deployment needs ~1.5 TB free ON TOP of
        works-vectors-v1 (2.06 TB of a 3.24 TB cluster). Add a third data node before the
        full sync; remove it once v1 is dropped after the flip.

        Full sync: ~473.6M docs, ~6-8 hours, checkpointed (safe to re-run to resume).
        Uses its own staging/checkpoint tables so the v1 sync can still run alongside.
      email_notifications:
        on_failure:
          - jason@ourresearch.org
        no_alert_for_skipped_runs: true
      max_concurrent_runs: 1
      tasks:
        - task_key: sync_vector_index_qwen3
          notebook_task:
            notebook_path: notebooks/elastic/sync_vector_index_qwen3
            source: GIT
          job_cluster_key: vector_sync_cluster
      job_clusters:
        - job_cluster_key: vector_sync_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            aws_attributes:
              first_on_demand: 1
              availability: ON_DEMAND
              zone_id: auto
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: rd-fleet.12xlarge
            driver_node_type_id: rd-fleet.8xlarge
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 2
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      parameters:
        - name: is_full_sync
          default: "true"
