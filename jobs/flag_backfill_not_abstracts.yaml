resources:
  jobs:
    Flag_Backfill_Not_Abstracts:
      name: Flag Backfill Not Abstracts
      description: |
        oxjob #1800: build openalex.abstracts.abstracts_backfill_not_abstract, the work_ids whose
        legacy abstracts_backfill text (after the #807 repair overlay) is not an abstract per
        parseland-lib's not_abstract.is_not_abstract (site blurbs, "No abstract available.", SEO
        templates, CABI datasheet lines). CreateWorksBase anti-joins it, so those works fall through
        to no abstract instead of the junk.

        MANUAL TRIGGER ONLY: no schedule. The backfill is a static snapshot, so re-run only when the
        filter changes (new parseland-lib commit: upload its two files to the Volume, bump
        FILTER_COMMIT and the hashes in the notebook). INSERT OVERWRITE keeps the table present
        throughout; never DROP it while CreateWorksBase reads it.
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      max_concurrent_runs: 1
      tasks:
        - task_key: flag_backfill_not_abstracts
          notebook_task:
            notebook_path: notebooks/maintenance/FlagBackfillNotAbstracts
            source: GIT
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: STANDARD
