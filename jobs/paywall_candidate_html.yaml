resources:
  jobs:
    Paywall_Candidate_HTML:
      name: Paywall Candidate HTML Ingest
      max_concurrent_runs: 8
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      tasks:
        - task_key: Ingest_Candidate_HTML
          job_cluster_key: ingest_cluster
          notebook_task:
            notebook_path: notebooks/paywall_signals/ingest_candidate_html
            source: GIT
            base_parameters:
              rebuild_cohort: "false"
              cohort_table: openalex.parseland.pdf_candidate_cohort
              target_table: openalex.landing_page.pdf_candidate_html
              num_buckets: "1"
              bucket: "0"
              file_limit: "0"
              max_threads: "24"
          max_retries: 2
          min_retry_interval_millis: 300000
      job_clusters:
        - job_cluster_key: ingest_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
              spark.sql.execution.arrow.maxRecordsPerBatch: "200"
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: us-east-1f
              spot_bid_price_percent: 100
            node_type_id: m5d.4xlarge
            driver_node_type_id: m5d.4xlarge
            custom_tags:
              ResourceClass: SingleNode
            num_workers: 0
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: false
