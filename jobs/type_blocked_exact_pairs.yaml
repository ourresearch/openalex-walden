resources:
  jobs:
    Type_Blocked_Exact_Pairs:
      name: Type Blocked Exact Pairs
      description: |
        oxjob #1722: a log of the exact matches the record-to-work matcher's type veto keeps apart (the veto is unchanged:
        Casey 2026-10-15, a wrong type is fixed at the source, in the type dictionary or cascade, never at merge time).
        Each night it writes one row per record Map Work Ids kept off the title rule's work although the two are an exact
        match (folded title, first-author surname, year +/- 1) across a vetoed type pair, with what each side sends (raw
        type, host), to openalex.monitoring.type_blocked_exact_pairs. A source fix shows as its host leaving the log; a new
        offender shows up by host and raw type.
        Read-only on the matcher's tables; writes only that table.
        When: 22:45 UTC daily, after End 2 End (Map Work Ids writes the night's decisions).
        Steps: one SQL notebook, notebooks/metrics/TypeBlockedExactPairs.
        Recover: rerun with night=<date>. Each night is delete-then-insert, so a rerun or a backfill is safe.
        No fallback: a night with no finished live matcher run fails the task.
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      timeout_seconds: 3600
      max_concurrent_runs: 1
      schedule:
        # 22:45 UTC: End 2 End starts 05:00 UTC and is usually done by ~17:30
        quartz_cron_expression: 0 45 22 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      parameters:
        - name: night
          # the matcher night to log; blank = the latest night with a finished live run (it must be today or yesterday)
          default: ""
      tasks:
        - task_key: type_blocked_exact_pairs
          notebook_task:
            notebook_path: notebooks/metrics/TypeBlockedExactPairs
            source: GIT
          environment_key: Default
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: STANDARD
