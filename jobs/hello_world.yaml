resources:
  jobs:
    Hello_World:
      name: Hello World
      description: Trivial hello-world smoke test. Manual trigger only (no schedule); runs on serverless.
      max_concurrent_runs: 1
      tasks:
        - task_key: hello_world
          notebook_task:
            notebook_path: notebooks/utils/HelloWorld
            source: GIT
          # no cluster config = serverless
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: false
