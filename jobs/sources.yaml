# CUTOVER-DAY FILE (oxjob #548, step B8) — copy over walden jobs/sources.yaml and push.
# Replaces the Sources DLT pipeline resource with a plain serverless SQL job running the
# converted CreateSources notebook (source: GIT, so it always runs main). CI deploy then
# DESTROYS the pipeline — which DROPS its DLT-owned tables (sources + intermediates) — and
# creates this job; its first run recreates openalex.sources.sources as a regular Delta
# table. Also delete the UI wrapper job 553536255733191 ("Sources", daily 05:00 UTC,
# not bundle-managed) via API — this bundle job takes over its schedule.
resources:
  jobs:
    sources_snapshot:
      name: Sources
      schedule:
        quartz_cron_expression: 0 0 5 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: create_sources
          notebook_task:
            notebook_path: notebooks/sources/CreateSources
            base_parameters:
              env_suffix: "{{job.parameters.env_suffix}}"
            source: GIT
            warehouse_id: 3996dc0a9b183ce3
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      parameters:
        - name: env_suffix
          default: ""
      tags:
        environment: prod
