resources:
  jobs:
    Map_Work_Ids:
      name: Map Work Ids
      description: |
        End 2 End's Map_Work_Ids task (oxjob #764, #1668): gives every location that needs a work tonight its work id, an existing
        one or a new one, and pins it in openalex.works.location_work_ids. Started by End 2 End after Locations_with_Types and
        Merge_Declared_Links; Locations_Mapped waits for it. No schedule of its own; one run at a time.
        Steps: match_locations_by_identifier (the work already holding the record's DOI / PMID / arXiv id, the work it declares
        itself a version or preprint of, its legacy MAG / PMH id; retries and records a correction job unpinned keep the title rule)
        -> the location matcher on the first-sight records nothing matched (prepare -> go_gate -> keys + embed -> candidates + knn
        (exact kNN over work_embeddings_qwen3 on GPUs) -> features -> score_xgb (openalex.works.location_work_matcher@challenger,
        hard rules first) -> score_qwen (Qwen3.5-9B + ep2_9b_old on Modal, app location-work-matcher; copy sums) ->
        write_decisions (openalex.works.location_work_match_decisions)) -> assign_work_ids (new works minted, every record pinned
        once; the only writer of location_work_ids and work_id_map). The night's answers: openalex.works.location_work_ids_verdicts;
        how each record got its work: location_work_ids.work_id_source (location_matcher = the matcher's pick, new_work = a work
        minted for it). The heavy SQL runs on PROD-WH (lwm.py). No fallback (Casey 2026-10-26 / 2026-11-01): when any step cannot
        run in full (no GPUs, Modal down, Qwen over max_usd, a record without a decision) the run fails and End 2 End stops here.
      email_notifications:
        on_failure:
          - casey@ourresearch.org
        no_alert_for_skipped_runs: true
      timeout_seconds: 21600
      max_concurrent_runs: 1
      parameters:
        - name: mode
          default: live
        - name: parts
          # corpus tasks for the kNN (two run per GPU)
          default: "80"
        - name: volume_dir
          default: /Volumes/openalex/works/data/location_work_match
        - name: endpoint
          default: https://wordslikethis--location-work-matcher-api.modal.run
        - name: secret_scope
          default: modal
        - name: secret_key
          default: location_matcher_token
        - name: warehouse_id
          # the warehouse the Modal app exports the prompts through (DEV-WH, X-Large serverless)
          default: 3996dc0a9b183ce3
        - name: max_usd
          # score_qwen fails the run when its Modal estimate is over this (Casey 2026-10-30: 60 -> 100 after a 705K-record night
          # estimated $65.27; a normal night is $5-14)
          default: "100"
        - name: max_minutes
          default: "240"
        - name: shard_records
          default: "4000"
        - name: run_id
          default: "{{job.run_id}}"
      tasks:
        - task_key: match_locations_by_identifier
          notebook_task:
            notebook_path: notebooks/end2end/MatchLocationsByIdentifier
            source: GIT
          environment_key: Default
        - task_key: prepare
          depends_on:
            - task_key: match_locations_by_identifier
          notebook_task:
            notebook_path: notebooks/location_matching/PrepareMatchInputs
            source: GIT
          environment_key: Default
        - task_key: go_gate
          depends_on:
            - task_key: prepare
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.prepare.values.go}}"
            right: "true"
        - task_key: keys
          # blocking keys of every work at V; in the nightly this can run before the night's records arrive
          depends_on:
            - task_key: go_gate
              outcome: "true"
          notebook_task:
            notebook_path: notebooks/location_matching/RunMatchSql
            base_parameters:
              sql: keys.sql
            source: GIT
          environment_key: Default
        - task_key: embed
          depends_on:
            - task_key: go_gate
              outcome: "true"
          notebook_task:
            notebook_path: notebooks/location_matching/RunMatchSql
            base_parameters:
              sql: embed.sql
            source: GIT
          environment_key: Default
        - task_key: candidates
          # runs alongside the GPU search
          depends_on:
            - task_key: keys
          notebook_task:
            notebook_path: notebooks/location_matching/RunMatchSql
            base_parameters:
              sql: candidates.sql
            source: GIT
          environment_key: Default
        - task_key: knn
          depends_on:
            - task_key: embed
          notebook_task:
            notebook_path: notebooks/location_matching/KnnSearch
            source: GIT
          job_cluster_key: knn_gpu
        - task_key: features
          depends_on:
            - task_key: knn
            - task_key: candidates
          notebook_task:
            notebook_path: notebooks/location_matching/RunMatchSql
            base_parameters:
              sql: knn_rank.sql,features.sql
            source: GIT
          environment_key: Default
        - task_key: score_xgb
          depends_on:
            - task_key: features
          notebook_task:
            notebook_path: notebooks/location_matching/ScoreXgboost
            source: GIT
          environment_key: Xgb
        - task_key: score_qwen
          depends_on:
            - task_key: score_xgb
          notebook_task:
            notebook_path: notebooks/location_matching/ScoreQwenModal
            source: GIT
          environment_key: Default
        - task_key: write_decisions
          depends_on:
            - task_key: score_qwen
          notebook_task:
            notebook_path: notebooks/location_matching/WriteDecisions
            source: GIT
          environment_key: Default
        # runs when the matcher decided the night or had nothing to decide (go_gate false), never after a failed step
        - task_key: assign_work_ids
          depends_on:
            - task_key: match_locations_by_identifier
            - task_key: write_decisions
          run_if: NONE_FAILED
          notebook_task:
            notebook_path: notebooks/end2end/AssignWorkIds
            source: GIT
          environment_key: Default
      job_clusters:
        - job_cluster_key: knn_gpu
          new_cluster:
            spark_version: 16.4.x-gpu-ml-scala2.13
            node_type_id: g5.2xlarge         # 1 x A10G: deep pools (GPU stockout playbook); 3.4e9 query-vector pairs / s per GPU
            driver_node_type_id: g5.4xlarge
            autoscale:
              min_workers: 16   # start near full size: the search is GPU-bound now (export), a 4 -> 20 ramp only adds wall time
              max_workers: 20
            aws_attributes:
              zone_id: auto
              availability: ON_DEMAND
            spark_conf:
              spark.task.resource.gpu.amount: "0.5"
              spark.sql.execution.arrow.maxRecordsPerBatch: "8192"
            custom_tags:
              oxjob: "1668"
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
        - environment_key: Xgb
          spec:
            environment_version: "4"
            dependencies:
              - xgboost==2.1.3
              - mlflow
