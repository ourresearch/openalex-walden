# Edge autocomplete (oxjob #1529): one job per entity type, triggered when its source table updates. Each run rebuilds
# openalex.autocomplete.nodes_<type> and copies what changed into Cloudflare Workers KV (and the Asia-Pacific copies)
# for the Worker openalex-autocomplete-edge. Writes only openalex.autocomplete.* and the edge; feeds no works, no ES.
# Run by hand with force_rebuild=true to write a fresh build and flip to it (utils/autocomplete_edge.py refresh()).
resources:
  jobs:
    Autocomplete_Edge_Keywords:
      name: Autocomplete Edge keywords
      description: Edge autocomplete index for keywords (oxjob #1529), triggered by openalex.common.keywords_api.
      email_notifications:
        on_failure:
          - jason@ourresearch.org
        no_alert_for_skipped_runs: true
      max_concurrent_runs: 1
      timeout_seconds: 7200
      trigger:
        pause_status: UNPAUSED
        table_update:
          table_names:
            - openalex.common.keywords_api
          condition: ANY_UPDATED
          wait_after_last_change_seconds: 600
      parameters:
        - name: force_rebuild
          default: "false"
        - name: copies
          default: ""
      tasks:
        - task_key: refresh
          notebook_task:
            notebook_path: notebooks/autocomplete_edge/RefreshAutocompleteEdge
            source: GIT
            base_parameters:
              typ: keywords
              steps: build,load
              force_rebuild: "{{job.parameters.force_rebuild}}"
              copies: "{{job.parameters.copies}}"
          environment_key: Default
          max_retries: 1
          min_retry_interval_millis: 600000
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
