resources:
  jobs:
    Wunpaywall_Data_Feed_Weekly:
      name: Wunpaywall Data Feed Weekly
      email_notifications:
        on_failure:
          - casey@ourresearch.org
      schedule:
        quartz_cron_expression: 5 30 10 ? * Tue
        timezone_id: America/Chicago
        pause_status: UNPAUSED
      tasks:
        - task_key: Wunpaywall_Weekly_Data_Feed
          notebook_task:
            notebook_path: notebooks/end2end/WunpaywallDataFeed
            base_parameters:
              mode: weekly
            source: GIT
          existing_cluster_id: 0520-143805-ri5288n
        - task_key: Unpaywall_Lakebase_Export_Metadata
          depends_on:
            - task_key: Wunpaywall_Weekly_Data_Feed
          pipeline_task:
            pipeline_id: dd71de95-27da-4acd-a334-09997155e69e
            full_refresh: false
          timeout_seconds: 1800
          max_retries: 2
          min_retry_interval_millis: 120000
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
