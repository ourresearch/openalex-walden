# Not in databricks.yml: created with `databricks jobs create` from this file on 2026-11-19 (job 408025122314612, oxjob #2075/#2450)
# while the bundle is out of sync with the workspace. Whoever reconciles the bundle: include this file and bind
# that job instead of creating a second one.
resources:
  jobs:
    Crossref_Contributor_Roles:
      name: Crossref Contributor Roles
      description: CRediT roles from Crossref's raw files into openalex.crossref.crossref_contributor_roles (oxjob #2075); see notebooks/ingest/CrossrefContributorRoles.
      schedule:
        # after the day's Crossref pulls land (~02:40 UTC)
        quartz_cron_expression: 0 30 3 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: Read_Crossref_Contributor_Roles
          job_cluster_key: roles_cluster
          notebook_task:
            notebook_path: notebooks/ingest/CrossrefContributorRoles
            source: GIT
            base_parameters:
              days_back: "1"
          max_retries: 1
          min_retry_interval_millis: 600000
          timeout_seconds: 10800
      job_clusters:
        - job_cluster_key: roles_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: us-east-1f
              spot_bid_price_percent: 100
            node_type_id: m5d.2xlarge
            driver_node_type_id: m5d.2xlarge
            num_workers: 4
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            custom_tags:
              oxjob: "2075"
      git_source:
        git_url: https://github.com/ourresearch/openalex-walden.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
