# Monitoring checks — author matching (oxjob #1116; metrics from oxjob #640)
#
# This file IS the checklist. The engine (utils/monitoring_engine.py) evaluates it nightly;
# docs/monitoring/author_matching.md is RENDERED from it (scripts/monitoring_render_docs.py).
#
# Kept deliberately small (Casey, 2026-09-15): every check answers one of the seven questions
# below, pages are absolute lines only, and a check nobody would act on is not here.
#
# Expression grammar (deliberately tiny — anything richer becomes its own metric):
#   metric                 value with NULL dimension
#   metric[dim]            value for one dimension            (`|` is literal)
#   metric[pat*tern]       one finding per dimension matching; `*` is the capture, shared by
#                          every non-sum wildcard term in the expression
#   sum(metric[pat*tern])  sum over ALL matching dimensions (never narrowed by a capture)
#   + - * / ( )            arithmetic over terms
# Per-check fields:
#   rule: absolute | relative | both       relative = today vs trailing median ± MAD
#   rolling: N                             sum each term over the trailing N days first
#   delta: true                            value = today - yesterday
#   capture_from: today | window           where wildcard values come from (window = any day in
#                                          the baseline window → catches a dimension going silent)
#   missing_as_zero: true                  metric absent that day → 0 instead of no_data (a present
#                                          metric with an absent dimension is always 0)
#   min_denominator: N                     skip (insufficient_n) when the divisor is below N
#   watch_below/above, critical_below/above    absolute thresholds
#   mad_watch (4), mad_critical (8), confirm_days (2), direction (both|up|down),
#   window_days (21), min_history (7)      relative-rule tuning; critical = ≥8 MAD once, or
#                                          ≥4 MAD two nights running. Tuned on the 56-night replay.
#   max_status: watch                      never escalate past watch (informational)
#   page: true                             critical → notify, not just digest
#   enabled: false                         listed in the doc, not evaluated (proposed check)

component: author_matching
title: Author matching
owner: casey
history_note: >
  Every writer (MatchAuthors, AuthorshipDailyMetrics, the judge) emits to
  openalex.monitoring.metrics; history before 2026-09-15 was copied in from the retired
  openalex.authors.authorship_daily_metrics (oxjob 640). Metrics born 2026-09-13..16 (stage_*,
  e2e_runs_on_date, block_skew, seats_by_source, batch_seats, author_gain_top, new_works_seats)
  have absolute rules only until they carry 7 nights of history.
known_states:
  - The n3 / n4 / n5 tier families have never fired in ~6.3M tier-attributed matches. Unreachable
    or a bug — separate job. Not a Monitoring finding.
  - s5_n2 precision collapses on dataset-wave nights (IGSN / Geoscience Australia). The tier is
    healthy on human names; the wave is the problem. See section 5.
open_decisions:
  - >
    Precision thresholds (80/70; 90/80 for ORCID) come from the healthy-tier band in the oxjob 640
    history, not from a product target. Replace with the stated author-precision goal if one exists.
  - >
    Precision against a reference: the AER gold set (oxjobs/archived/aer-gold-standard) is
    author-level JSONL, not a seat-level table, so a "rebound gold seats scored correct" check
    needs that table built first. Until then precision is judge-only (±3pp on a 7-day window).
  - >
    Which items page — draft: the run section, precision, impossible names, the absorber and
    author-gain lines, waves, the reservoir/stale/fingerprint absolutes. Observation-only for the
    first 14 nights.

sections:

  - id: run
    question: Did the matcher run, finish, and finish in a reasonable time?
    checks:
      - id: stage_success
        title: every authorship stage succeeded
        expr: stage_success[*]
        rule: absolute
        critical_below: 1
        page: true
        failure_modes: end2end task failure; bundle-lock deploy race; Guardrails block upstream
      - id: e2e_runs
        title: exactly one end2end run today
        expr: e2e_runs_on_date
        rule: absolute
        critical_below: 1
        watch_above: 1
        page: true
        failure_modes: manual rerun mid-day (07-27 double-judge); >1 means today's metrics cover a residual window only
      - id: match_wall
        title: MatchAuthors wall time
        expr: stage_wall_sec[Author_Matching]
        rule: both
        direction: up
        critical_above: 10800
        page: true
        failure_modes: PNNL/EMSL block skew put MatchAuthors at 2h (dedupe shipped 09-13)
      - id: matcher_emitted
        title: MatchAuthors emitted its run metrics tonight
        expr: batch_seats
        rule: absolute
        missing_as_zero: true
        critical_below: 1
        page: true
        failure_modes: the metric cells at the end of MatchAuthors did not run (task failed before them, or the monitoring schema is missing)

  - id: matching
    question: Are we matching the seats we should be matching?
    checks:
      - id: bound_share_new_works
        title: share of seats bound on works created 8..1 days ago (the user-visible outcome)
        expr: new_works_seats[bound] / new_works_seats[total]
        rule: relative
        direction: down
        min_denominator: 1000
        failure_modes: matcher skipping new works; eligibility gate (work_id > 7e9 / created ≥ 2025-12-20) drift; a source flooding with unmatched org names
      - id: match_rate
        title: matched share of the batch
        expr: match_outcome[MATCHED] / sum(match_outcome[*])
        rule: relative
        failure_modes: a tier cut (n8, 07-28) shifts the mix legitimately — expect a step, then accept the new baseline
      - id: ambiguous_share
        title: ambiguous share of the batch
        expr: match_outcome[AMBIGUOUS] / sum(match_outcome[*])
        rule: relative
        failure_modes: dataset-record waves inflate AMBIGUOUS (baseline ~40%)
      - id: no_candidates_share
        title: no-candidate share of the batch
        expr: match_outcome[NO_CANDIDATES] / sum(match_outcome[*])
        rule: relative
        failure_modes: block-key regression → everything looks new
      - id: tier_mix
        title: share of matches by tier
        expr: match_tier[*] / match_outcome[MATCHED]
        rule: relative
        max_status: watch
        failure_modes: a tier that jumps is usually a wave landing in it (s5_n2, 07-29)
      - id: orcid_tier
        title: ORCID tier still firing
        expr: match_tier[orcid]
        rule: relative
        direction: down
        failure_modes: ORCID column dropped upstream; publisher ORCID feed change
      - id: eligible_backlog_delta
        title: match-eligible null-author backlog, day-over-day
        expr: null_reservoir[seats_match_eligible]
        delta: true
        rule: absolute
        watch_above: 100000
        critical_above: 500000
        page: true
        failure_modes: 07-22 +185K watch item; reservoir should trend flat-to-down

  - id: correctness
    question: Are the matches we make correct?
    checks:
      - id: precision_by_tier
        title: judged precision by tier (7-day rolling)
        expr: judge_arm_a[*|same_person] / (judge_arm_a[*|same_person] + judge_arm_a[*|different_person])
        rolling: 7
        min_denominator: 30
        rule: absolute
        watch_below: 0.80
        critical_below: 0.70
        page: true
        failure_modes: n8 tiers at 6–26% (cut 07-28); s5_n2 at 28–33% on wave nights = contamination, not the tier
      - id: precision_orcid
        title: ORCID-tier judged precision (7-day rolling) — 63% of all matches
        expr: judge_arm_a[orcid|same_person] / (judge_arm_a[orcid|same_person] + judge_arm_a[orcid|different_person])
        rolling: 7
        min_denominator: 30
        rule: absolute
        watch_below: 0.90
        critical_below: 0.80
        page: true
        failure_modes: PNNL staff ORCIDs on data-deposit records (36/78 all-time FPs from S7407051155) — exclude that source before trusting a dip
      - id: orcid_qa
        title: ORCID sanity counters
        expr: orcid_qa[*]
        rule: relative
        max_status: watch
        failure_modes: a publisher shipping wrong ORCIDs shows as a name_conflict spike
      - id: orcid_mint_collisions
        title: ORCID mint collisions
        expr: orcid_mint_collisions
        rule: absolute
        watch_above: 100
        critical_above: 500
        failure_modes: two profiles minted for one ORCID in one night
      - id: name_change_incompatible
        title: incompatible name changes on bound seats
        expr: name_change_quality[works_incompatible] / name_change_quality[works_judged]
        rule: relative
        direction: up
        failure_modes: 07-21 — 1,250 incompatible vs 3,018 cosmetic; the real rematch workload
      - id: impossible_name_total
        title: foreign-family assignments tonight, all tiers (seat name cannot be the profile it was bound to)
        expr: sum(assign_name_check[foreign_family|*])
        rule: absolute
        missing_as_zero: true
        watch_above: 500
        critical_above: 1000
        page: true
        failure_modes: >
          09-13 — 454 over 509K judged seats (26 name-tier / 428 ORCID). ORCID matches have NO name gate;
          this is their only one. A name-tier hit means the profile's display name drifted since the match.
      - id: absorber
        title: one profile absorbing many impossible names
        expr: assign_name_check_top[*]
        rule: absolute
        critical_above: 25
        page: true
        failure_modes: >
          09-13 — "Naruki Hiranuma" (A5005965575) absorbed every "Moon, Seong-gi" seat from PNNL via a shared
          ORCID: one collision, dozens of seats. The absorber pattern built #608's 9.9M misbound rows.
      - id: author_gain_max
        title: most seats bound to one existing author tonight (absorber or hyperauthor, name-agnostic)
        expr: author_gain_top[*]
        rule: absolute
        watch_above: 5000
        critical_above: 25000
        page: true
        failure_modes: an org pseudo-author or a shared ORCID absorbing a roster; a hyperauthorship paper adds 1 seat per author, not thousands to one

  - id: minting
    question: Are we minting new authors only when we should?
    checks:
      - id: mint_ratio
        title: mints per batch seat
        expr: new_authors_minted / sum(match_outcome[*])
        rule: relative
        failure_modes: "raw mint count spikes with batch size (oxjob 682 reparse, oxjob 649 admissions); ratio stable 21–29% even on 235K-mint days"
      - id: mint_with_orcid
        title: share of mints carrying an ORCID
        expr: new_authors_minted[with_orcid] / new_authors_minted
        rule: relative
        failure_modes: ORCID loss upstream shows here first
      - id: mint_from_ambiguous
        title: share of mints from AMBIGUOUS (the splinter-risk pool)
        expr: new_authors_minted[from_ambiguous] / new_authors_minted
        rule: relative
        failure_modes: baseline ~78%
      - id: mint_dup_holder
        title: mints whose ORCID an older profile already held
        expr: new_authors_minted[dup_of_existing_holder]
        rule: absolute
        missing_as_zero: true
        watch_above: 50
        critical_above: 1000
        page: true
        failure_modes: >
          the ORCID tier's holder lookup is stale or wrong: 2026-07-15/16 minted 59K same-ORCID profiles in
          two nights unseen. Before oxjob #444 the 12:21 UTC authors_for_matching rebuild racing this run
          leaked ~40/night; the tier now also reads openalex.authors.authors, so expect ~0.
      - id: splinter_rate
        title: judged splinter rate (arm B candidate pick, 7-day rolling)
        expr: judge_arm_b[candidate_pick] / (judge_arm_b[candidate_pick] + judge_arm_b[none_correct] + judge_arm_b[cannot_determine])
        rolling: 7
        min_denominator: 30
        rule: absolute
        watch_above: 0.60
        failure_modes: "an existing candidate would have been the right answer (baseline 45–60%); supports the oxjob 453 coauthor tier"

  - id: waves
    question: Are we being flooded by non-human or organisational "authors"?
    checks:
      - id: hot_name_max
        title: single raw name over the wave line (named)
        expr: name_concentration_top[*]
        rule: absolute
        watch_above: 25000
        critical_above: 100000
        page: true
        failure_modes: Geoscience Australia 43K/night, Scan-the-World, GBIF.org User, Atlas of Living Australia ×5
      - id: block_skew
        title: largest block, in join rows
        expr: block_skew[max_block_rows_seats]
        rule: both
        direction: up
        critical_above: 1000000000
        page: true
        failure_modes: "`y wang` block 2.5B rows on one task; PNNL/EMSL staff roster"
      - id: source_share
        title: one source's share of the batch (top 5, named)
        expr: seats_by_source[*] / sum(match_outcome[*])
        rule: absolute
        watch_above: 0.30
        failure_modes: S7407051155 (DOE PNNL) mints 20–24K dataset works/day; S7407053303 IGSN samples

  - id: stability
    question: Are existing authorships stable?
    checks:
      - id: churn_by_class
        title: author-list churn by class
        expr: author_list_changes[*]
        rule: relative
        max_status: watch
        failure_modes: >
          baselines — grows 150–9K/day, shrinks 250–3.6K, name changes 2K–12K; a source reparse (T&F, #682)
          is a NAMES_CHANGED step; mass-touch days hit 30M+ works on updated_date but the content diff stays small
      - id: stale_backlog_delta
        title: stale-seat backlog, day-over-day
        expr: stale_seats[rows]
        delta: true
        rule: absolute
        watch_above: 100000
        critical_above: 1000000
        page: true
        failure_modes: no MERGE deletes seats — the backlog only shrinks via explicit work (baseline 5.29M rows / 1.79M works)
      - id: fingerprint_coverage
        title: fingerprint never shrinks
        expr: fingerprint_works_tracked
        delta: true
        rule: absolute
        critical_below: 0
        page: true
        failure_modes: fingerprint table truncated / bootstrap rerun

  - id: self
    question: Is the monitor's own machinery healthy and affordable?
    checks:
      - id: judge_sample
        title: judge ran and sampled enough (arm A verdicts)
        expr: sum(judge_arm_a[*])
        rule: absolute
        missing_as_zero: true
        watch_below: 300
        failure_modes: temperature bug on cluster-side ai_query (07-26); endpoint outage; dedupe by (name, author_id) starving a tier
      - id: judge_cost
        title: judge cost (cents)
        expr: judge_cost_cents
        rule: absolute
        watch_above: 1000
        critical_above: 5000
        failure_modes: double pass (07-26/27); ORCID arms at 100/night ≈ +$1; baseline ~320
      - id: collector_errors
        title: observer collected everything
        expr: sum(collector_error[*])
        rule: absolute
        missing_as_zero: true
        watch_above: 0
        failure_modes: Jobs API / query-history permission changes
      - id: assignment_log_complete
        title: assignment log rows ≈ batch seats
        expr: assignment_log_rows / sum(match_outcome[*])
        rule: absolute
        watch_below: 0.99
        watch_above: 1.01
        failure_modes: 120-day retention delete misfiring
