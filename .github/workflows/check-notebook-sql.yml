name: Check notebook SQL

# oxjob #1932: a Databricks job run blanks `$1`, `$name` and `${name}` in notebook SQL (legacy widget
# substitution), so a regexp backreference that works when tested becomes '' every night. This fails the
# commit when notebook SQL holds such a dollar; scripts/check_notebook_sql_dollar.py says how to write it.

on:
  push:
    branches: [main]
    paths:
      - 'notebooks/**'
      - 'scripts/check_notebook_sql_dollar.py'
      - 'scripts/gen_awards_sql.py'
      - 'scripts/check_works_enriched_publish.py'
      - 'scripts/check_warehouse_notebooks_sql_only.py'
      - 'scripts/check_notebook_sql_functions.py'
      - 'scripts/check_serverless_no_cache.py'
      - 'scripts/notebook_sql_functions.txt'
      - 'jobs/**'
      - 'libraries/**'
      - 'utils/**'
      - '.github/workflows/check-notebook-sql.yml'
  pull_request:
    paths:
      - 'notebooks/**'
      - 'scripts/check_notebook_sql_dollar.py'
      - 'scripts/gen_awards_sql.py'
      - 'scripts/check_works_enriched_publish.py'
      - 'scripts/check_warehouse_notebooks_sql_only.py'
      - 'scripts/check_notebook_sql_functions.py'
      - 'scripts/check_serverless_no_cache.py'
      - 'scripts/notebook_sql_functions.txt'
      - 'jobs/**'
      - 'libraries/**'
      - 'utils/**'

permissions:
  contents: read

jobs:
  dollar-signs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checker self-test
        run: python3 scripts/check_notebook_sql_dollar.py --self-test
      - name: No dollar sign a job run would blank
        run: python3 scripts/check_notebook_sql_dollar.py notebooks
      - name: Awards notebook is what sources.csv and sources/*.sql render
        run: python3 scripts/gen_awards_sql.py --check
      - name: openalex_works is written only by Publish_Works, after Guardrails accepts the candidate (oxjob #2004, #2052)
        run: |
          python3 scripts/check_works_enriched_publish.py --self-test
          python3 scripts/check_works_enriched_publish.py
      - name: A notebook run on a SQL warehouse holds only SQL cells (oxjob #1642)
        run: |
          python3 scripts/check_warehouse_notebooks_sql_only.py --self-test
          python3 scripts/check_warehouse_notebooks_sql_only.py
      - name: Every function notebook SQL calls exists in Databricks (oxjob #2342; night 11-21 lost its run to Postgres' strpos)
        run: |
          python3 scripts/check_notebook_sql_functions.py --self-test
          python3 scripts/check_notebook_sql_functions.py notebooks jobs
      - name: No cache/persist in a notebook a job runs on serverless (oxjob #1231; OpenAPC's first run failed on it)
        run: |
          python3 scripts/check_serverless_no_cache.py --self-test
          python3 scripts/check_serverless_no_cache.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: No funder is matched by its Crossref registry ID, and no Crossref deposit ROR is read (oxjob #2373)
        run: |
          python -m pip install --quiet pytest
          python -m pytest notebooks/funders/tests/test_no_crossref_registry_id.py -q -p no:cacheprovider
