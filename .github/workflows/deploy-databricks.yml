name: Deploy Databricks Bundle

on:
  push:
    branches: [main]
    paths:
      - 'databricks.yml'
      - 'jobs/**'
      - 'notebooks/**'
  workflow_dispatch:

# oxjob #1782: actions pinned to commit SHAs, and the workflow token can only read the repo.
# oxjob #1973: Databricks login is GitHub OIDC, no stored secret. The github-actions-deploy federation
# policy trusts only tokens for environment databricks-prod, and that environment allows only main.
permissions:
  contents: read
  id-token: write

# oxjob #2088: deploys queue instead of colliding on the bundle's deploy lock (every failed deploy in Oct-Nov 2026
# was "Failed to acquire deployment lock"). A newer queued run replaces an older queued one; it deploys a later main.
concurrency:
  group: databricks-bundle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: databricks-prod
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: https://dbc-ce570f73-0362.cloud.databricks.com
      DATABRICKS_CLIENT_ID: 321056ec-06df-41ad-8227-2c238f818596
      # The policy accepts only the account id as audience; the CLI's own default for a workspace differs.
      DATABRICKS_TOKEN_AUDIENCE: b190576d-b916-4834-b43e-a5225948f55b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # main as of 2026-10-23

      - name: Validate bundle
        run: databricks bundle validate

      # oxjob #1642 (18 Nov 2026): a deploy that adds or drops a Walden End 2 End task while a run is active makes Databricks
      # refuse every repair of that run ("job structure has changed"; 16, 17 Nov; 18 Nov 07:32 CT #2186's Language_Copies
      # landed mid-sync and its deploy was cancelled by hand). Such a deploy now waits here until the run ends. Fail-open:
      # anything this step cannot read lets the deploy go ahead as before.
      - name: Hold an End 2 End task change while a run is active
        timeout-minutes: 340
        run: |
          JOB=616701029470182
          want=$(databricks bundle validate -o json 2>/dev/null | python3 -c "import json,sys; print(len(json.load(sys.stdin)['resources']['jobs']['Walden_End_2_End']['tasks']))" 2>/dev/null || echo "")
          for i in $(seq 1 66); do
            have=$(databricks jobs get "$JOB" -o json 2>/dev/null | python3 -c "import json,sys; print(len(json.load(sys.stdin)['settings']['tasks']))" 2>/dev/null || echo "")
            active=$(databricks jobs list-runs --job-id "$JOB" --active-only -o json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); d=d if isinstance(d,list) else d.get('runs',[]); print(len(d))" 2>/dev/null || echo "")
            if [ -z "$want" ] || [ -z "$have" ] || [ -z "$active" ]; then echo "could not read tasks / runs (want=$want have=$have active=$active): deploying"; exit 0; fi
            if [ "$want" = "$have" ]; then echo "End 2 End task count unchanged ($have): deploying"; exit 0; fi
            if [ "$active" = "0" ]; then echo "End 2 End tasks $have -> $want and no run active: deploying"; exit 0; fi
            echo "End 2 End tasks $have -> $want while a run is active: waiting 5 min ($i/66)"; sleep 300
          done
          echo "End 2 End run still active after 5.5 h: not deploying a task change; re-run this workflow when the run ends"; exit 1

      - name: Deploy bundle
        run: databricks bundle deploy

      # oxjob #2088: no Slack post on success (345 a month in #dev, read by nobody); failures still post.
      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Databricks deploy failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Databricks deploy failed*\n- Commit: `${{ github.sha }}`\n- By: ${{ github.actor }}\n- <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
