name: Deploy Databricks Bundle

on:
  push:
    branches: [main]
    paths:
      - 'databricks.yml'
      - 'jobs/**'
      - 'notebooks/**'
  workflow_dispatch:

# oxjob #1782: actions pinned to commit SHAs, and the workflow token can only read the repo.
# oxjob #1973: Databricks login is GitHub OIDC, no stored secret. The github-actions-deploy federation
# policy trusts only tokens for environment databricks-prod, and that environment allows only main.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: databricks-prod
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: https://dbc-ce570f73-0362.cloud.databricks.com
      DATABRICKS_CLIENT_ID: 321056ec-06df-41ad-8227-2c238f818596
      # The policy accepts only the account id as audience; the CLI's own default for a workspace differs.
      DATABRICKS_TOKEN_AUDIENCE: b190576d-b916-4834-b43e-a5225948f55b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # main as of 2026-10-23

      - name: Validate bundle
        run: databricks bundle validate

      - name: Deploy bundle
        run: databricks bundle deploy

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Databricks deploy succeeded",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *Databricks bundle deployed*\n- Commit: `${{ github.sha }}`\n- By: ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Databricks deploy failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Databricks deploy failed*\n- Commit: `${{ github.sha }}`\n- By: ${{ github.actor }}\n- <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
