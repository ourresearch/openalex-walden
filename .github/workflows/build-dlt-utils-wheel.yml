name: Build and Upload DLT Utils Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'libraries/dlt_utils/**'
      - '.github/workflows/build-dlt-utils-wheel.yml'

# oxjob #1782: actions pinned to commit SHAs (a moved tag or branch can't swap in code that sees
# DATABRICKS_CLIENT_SECRET), and the workflow token can only read the repo.
permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: pip install wheel setuptools

      - name: Build wheel
        working-directory: libraries/dlt_utils
        run: python setup.py bdist_wheel --dist-dir dist

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # main as of 2026-10-23 (v1.22.1)

      - name: Upload package to Volumes
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          WHEEL=$(ls libraries/dlt_utils/dist/*.whl)
          WHEEL_NAME=$(basename "$WHEEL")
          TOKEN=$(curl -s -X POST "${DATABRICKS_HOST}/oidc/v1/token" \
            -d "grant_type=client_credentials&client_id=${DATABRICKS_CLIENT_ID}&client_secret=${DATABRICKS_CLIENT_SECRET}&scope=all-apis" \
            | jq -r '.access_token')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            "${DATABRICKS_HOST}/api/2.0/fs/files/Volumes/openalex/default/libraries/${WHEEL_NAME}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${WHEEL}")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "Uploaded ${WHEEL_NAME}"
          else
            echo "Upload failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "DLT utils package uploaded",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":package: *DLT utils package uploaded*\n- Commit: `${{ github.sha }}`\n- By: ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "DLT utils package build failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *DLT utils package build failed*\n- Commit: `${{ github.sha }}`\n- By: ${{ github.actor }}\n- <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
