name: Build and Upload DLT Utils Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'libraries/dlt_utils/**'
      - '.github/workflows/build-dlt-utils-wheel.yml'

# oxjob #1782: actions pinned to commit SHAs, and the workflow token can only read the repo.
# oxjob #1973: Databricks login is GitHub OIDC through environment databricks-prod (main only), no stored secret.
permissions:
  contents: read
  id-token: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    environment: databricks-prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: pip install wheel setuptools

      - name: Build wheel
        working-directory: libraries/dlt_utils
        run: python setup.py bdist_wheel --dist-dir dist

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # main as of 2026-10-23 (v1.22.1)

      - name: Upload package to Volumes
        env:
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_HOST: https://dbc-ce570f73-0362.cloud.databricks.com
          DATABRICKS_CLIENT_ID: 321056ec-06df-41ad-8227-2c238f818596
          # The policy accepts only the account id as audience; the CLI's own default for a workspace differs.
          DATABRICKS_TOKEN_AUDIENCE: b190576d-b916-4834-b43e-a5225948f55b
        run: |
          WHEEL=$(ls libraries/dlt_utils/dist/*.whl)
          databricks fs cp "$WHEEL" "dbfs:/Volumes/openalex/default/libraries/$(basename "$WHEEL")" --overwrite
          echo "Uploaded $(basename "$WHEEL")"

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "DLT utils package uploaded",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":package: *DLT utils package uploaded*\n- Commit: `${{ github.sha }}`\n- By: ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "DLT utils package build failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *DLT utils package build failed*\n- Commit: `${{ github.sha }}`\n- By: ${{ github.actor }}\n- <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
